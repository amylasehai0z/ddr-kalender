<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#CC0000">
<meta name="description" content="Gedenk- und Feiertage der Deutschen Demokratischen Republik">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DDR Kalender">
<link rel="manifest" href="manifest.json">
<title>DDR Kalender</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Special+Elite&family=PT+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --schwarz: #0e0e0e;
  --rot: #CC0000;
  --rot-dunkel: #990000;
  --gold: #D4A017;
  --creme: #F0E8D8;
  --grau: #2a2a2a;
  --text: #e8dcc8;
  --staat: #CC0000;
  --person: #D4A017;
  --international: #4a90a4;
  --beruf: #5a8a5a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--schwarz);
  color: var(--text);
  font-family: 'PT Serif', Georgia, serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
header {
  background: #0a0a0a;
  border-bottom: 3px solid var(--rot);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.6rem 1.2rem;
  gap: 0.8rem;
}
.logo { display: flex; align-items: center; gap: 0.7rem; }
.logo-emblem { width: 40px; height: 40px; flex-shrink: 0; }
.logo-title {
  font-family: 'Oswald', sans-serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--creme);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  line-height: 1;
}
.logo-sub {
  font-family: 'Special Elite', monospace;
  font-size: 0.58rem;
  color: var(--gold);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-top: 2px;
}
.header-right { display: flex; align-items: center; gap: 0.5rem; }

/* Install button */
.install-btn {
  display: none;
  align-items: center;
  gap: 0.35rem;
  padding: 0.3rem 0.65rem;
  background: none;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: 'Oswald', sans-serif;
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.install-btn.visible { display: flex; }
.install-btn:hover { background: var(--gold); color: var(--schwarz); }

.year-nav { display: flex; align-items: center; gap: 0.4rem; }
.year-btn {
  background: var(--grau);
  border: 1px solid #444;
  color: var(--creme);
  width: 30px; height: 30px;
  border-radius: 2px;
  cursor: pointer;
  font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.year-btn:hover { background: var(--rot); border-color: var(--rot); }
.year-btn:disabled { opacity: 0.3; cursor: default; }
.year-display {
  font-family: 'Oswald', sans-serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--gold);
  min-width: 72px;
  text-align: center;
}

/* ── NAV TABS ── */
.nav-tabs {
  display: flex;
  border-top: 1px solid #1e1e1e;
}
.tab {
  flex: 1;
  padding: 0.45rem 0.5rem;
  text-align: center;
  font-family: 'Oswald', sans-serif;
  font-size: 0.72rem;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #666;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.tab.active { color: var(--creme); border-bottom-color: var(--rot); background: #111; }
.tab:hover:not(.active) { color: #aaa; }

/* ── FILTER BAR ── */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.4rem 1.2rem;
  border-top: 1px solid #1a1a1a;
  overflow-x: auto;
  scrollbar-width: none;
  flex-wrap: wrap;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-label {
  font-family: 'Special Elite', monospace;
  font-size: 0.58rem;
  color: #555;
  letter-spacing: 0.15em;
  white-space: nowrap;
}
.chip {
  padding: 0.18rem 0.55rem;
  border-radius: 2px;
  border: 1px solid transparent;
  cursor: pointer;
  font-family: 'Oswald', sans-serif;
  font-size: 0.68rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  white-space: nowrap;
  transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 0.25rem;
}
.chip-dot { width: 6px; height: 6px; border-radius: 50%; }
.chip[data-cat="all"] { color: var(--creme); border-color: #444; background: #1e1e1e; }
.chip[data-cat="all"].active { background: #444; border-color: #666; }
.chip[data-cat="staat"] { color: var(--staat); border-color: #660000; }
.chip[data-cat="staat"].active { background: rgba(204,0,0,0.18); border-color: var(--rot); }
.chip[data-cat="person"] { color: var(--gold); border-color: #7a5a10; }
.chip[data-cat="person"].active { background: rgba(212,160,23,0.15); border-color: var(--gold); }
.chip[data-cat="international"] { color: var(--international); border-color: #2a5060; }
.chip[data-cat="international"].active { background: rgba(74,144,164,0.15); border-color: var(--international); }
.chip[data-cat="beruf"] { color: var(--beruf); border-color: #2a5a2a; }
.chip[data-cat="beruf"].active { background: rgba(90,138,90,0.15); border-color: var(--beruf); }

/* ── HEUTE VIEW ── */
#view-heute { display: none; }
#view-heute.active { display: block; }
#view-kalender { display: none; }
#view-kalender.active { display: block; }

.heute-wrapper {
  padding: 1.2rem 1.2rem 2rem;
  max-width: 680px;
  margin: 0 auto;
}

/* ── Big date hero ── */
.heute-hero {
  border: 1px solid #2a2a2a;
  border-top: 3px solid var(--rot);
  background: #111;
  padding: 1.2rem 1.4rem;
  margin-bottom: 1.2rem;
  border-radius: 0 0 2px 2px;
  position: relative;
  overflow: hidden;
}
.heute-hero::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 80px; height: 80px;
  background: radial-gradient(circle at top right, rgba(204,0,0,0.08), transparent 70%);
}
.heute-label {
  font-family: 'Special Elite', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.25em;
  color: var(--rot);
  text-transform: uppercase;
  margin-bottom: 0.3rem;
}
.heute-datum {
  font-family: 'Oswald', sans-serif;
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--creme);
  letter-spacing: 0.05em;
  line-height: 1.1;
}
.heute-wochentag {
  font-family: 'Special Elite', monospace;
  font-size: 0.7rem;
  color: var(--gold);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-top: 0.2rem;
}
.heute-day-count {
  margin-top: 0.8rem;
  padding-top: 0.7rem;
  border-top: 1px solid #222;
  font-family: 'Special Elite', monospace;
  font-size: 0.62rem;
  color: #555;
  letter-spacing: 0.1em;
}
.heute-day-count span { color: var(--gold); }

/* ── Section title ── */
.section-title {
  font-family: 'Oswald', sans-serif;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #555;
  margin-bottom: 0.6rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #222;
}

/* ── Event cards in Heute ── */
.heute-events { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.2rem; }
.heute-leer {
  padding: 1.5rem;
  text-align: center;
  color: #444;
  font-family: 'Special Elite', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  border: 1px dashed #222;
  border-radius: 2px;
}

.h-card {
  border-left: 3px solid var(--staat);
  padding: 0.6rem 0.8rem;
  background: #161616;
  border-radius: 0 2px 2px 0;
  cursor: pointer;
  transition: background 0.15s;
}
.h-card:hover { background: #1e1e1e; }
.h-card.person { border-color: var(--gold); }
.h-card.international { border-color: var(--international); }
.h-card.beruf { border-color: var(--beruf); }
.h-card-cat {
  font-family: 'Oswald', sans-serif;
  font-size: 0.55rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-bottom: 0.15rem;
}
.h-card.staat .h-card-cat { color: var(--staat); }
.h-card.person .h-card-cat { color: var(--gold); }
.h-card.international .h-card-cat { color: var(--international); }
.h-card.beruf .h-card-cat { color: var(--beruf); }
.h-card-title {
  font-family: 'Oswald', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  color: var(--creme);
  line-height: 1.25;
  margin-bottom: 0.25rem;
}
.h-card-desc {
  font-size: 0.76rem;
  color: #999;
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ── Nächste Termine ── */
.naechste-list { display: flex; flex-direction: column; gap: 0; }
.naechste-item {
  display: flex;
  align-items: flex-start;
  gap: 0.8rem;
  padding: 0.55rem 0;
  border-bottom: 1px solid #1e1e1e;
  cursor: pointer;
  transition: background 0.12s;
}
.naechste-item:hover { background: #141414; padding-left: 0.4rem; }
.naechste-item:last-child { border-bottom: none; }
.naechste-date-block {
  flex-shrink: 0;
  width: 44px;
  text-align: center;
  background: #1a1a1a;
  border-radius: 2px;
  padding: 0.2rem 0;
}
.naechste-day {
  font-family: 'Oswald', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--creme);
  line-height: 1;
}
.naechste-mon {
  font-family: 'Special Elite', monospace;
  font-size: 0.5rem;
  color: var(--gold);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.naechste-in {
  font-family: 'Special Elite', monospace;
  font-size: 0.45rem;
  color: #555;
  margin-top: 1px;
}
.naechste-info { flex: 1; }
.naechste-title {
  font-family: 'Oswald', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--creme);
  line-height: 1.25;
}
.naechste-dots {
  display: flex; gap: 2px; margin-top: 3px;
}
.naechste-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
}
.naechste-dot.staat { background: var(--staat); }
.naechste-dot.person { background: var(--gold); }
.naechste-dot.international { background: var(--international); }
.naechste-dot.beruf { background: var(--beruf); }

/* ── ICS Banner ── */
.ics-banner {
  margin-top: 1.5rem;
  padding: 0.8rem 1rem;
  border: 1px solid #222;
  border-left: 3px solid var(--gold);
  background: #111;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.8rem;
  flex-wrap: wrap;
  border-radius: 0 2px 2px 0;
}
.ics-text {
  font-family: 'Special Elite', monospace;
  font-size: 0.65rem;
  color: #777;
  letter-spacing: 0.08em;
  line-height: 1.5;
}
.ics-text strong { color: var(--gold); }
.ics-link {
  font-family: 'Oswald', sans-serif;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--schwarz);
  background: var(--gold);
  padding: 0.3rem 0.8rem;
  border-radius: 2px;
  text-decoration: none;
  white-space: nowrap;
  transition: background 0.15s;
}
.ics-link:hover { background: var(--gold-hell, #e8c020); }

/* ── KALENDER VIEW ── */
.kalender {
  padding: 0.8rem 0.8rem 3rem;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.7rem;
}
@media (max-width: 900px) { .kalender { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 620px) { .kalender { grid-template-columns: repeat(2, 1fr); } }

.monat { background: var(--grau); border: 1px solid #333; border-radius: 2px; overflow: hidden; }
.monat-header {
  background: #1a1a1a;
  padding: 0.35rem 0.55rem;
  border-bottom: 2px solid var(--rot);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.monat-name {
  font-family: 'Oswald', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--creme);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.monat-count { font-family: 'Special Elite', monospace; font-size: 0.58rem; color: #555; }
.monat-count.has-events { color: var(--gold); }
.wochen-kopf {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 0.2rem 0.35rem 0.05rem;
}
.wt { text-align: center; font-family: 'Oswald', sans-serif; font-size: 0.5rem; color: #484848; text-transform: uppercase; }
.wt.we { color: #553333; }
.tage-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 0 0.35rem 0.35rem;
  gap: 1px;
}
.tag {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 2px;
  position: relative;
  cursor: default;
  min-height: 1.1rem;
}
.tag-num {
  font-family: 'Oswald', sans-serif;
  font-size: 0.6rem;
  color: #777;
  line-height: 1;
}
.tag.wochenende .tag-num { color: #5a4444; }
.tag.hat-events { cursor: pointer; }
.tag.hat-events:hover { background: #3a3a3a; }
.tag.hat-events .tag-num { color: var(--creme); font-weight: 600; }
.tag.heute-mark { outline: 1px solid var(--gold); background: rgba(212,160,23,0.08); }
.tag.heute-mark .tag-num { color: var(--gold); }
.event-dots { display: flex; gap: 1px; margin-top: 1px; flex-wrap: wrap; justify-content: center; max-width: 14px; }
.dot { width: 3px; height: 3px; border-radius: 50%; }
.dot.staat { background: var(--staat); }
.dot.person { background: var(--gold); }
.dot.international { background: var(--international); }
.dot.beruf { background: var(--beruf); }

/* ── MODAL ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.78);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.overlay.open { display: flex; }
@media (min-width: 600px) { .overlay { align-items: center; } }
.modal {
  background: #131313;
  border: 1px solid #2e2e2e;
  border-top: 3px solid var(--rot);
  width: 100%;
  max-width: 540px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  border-radius: 2px 2px 0 0;
  animation: slide-up 0.2s ease;
}
@media (min-width: 600px) { .modal { border-radius: 2px; max-height: 78vh; } }
@keyframes slide-up {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-header {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid #222;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.modal-date { font-family: 'Oswald', sans-serif; font-size: 1rem; font-weight: 600; color: var(--gold); letter-spacing: 0.07em; }
.modal-close { background: none; border: none; color: #555; font-size: 1.3rem; cursor: pointer; padding: 0 0.2rem; transition: color 0.15s; }
.modal-close:hover { color: var(--creme); }
.modal-body {
  overflow-y: auto;
  padding: 0.8rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  scrollbar-width: thin;
  scrollbar-color: #333 transparent;
}
.m-card {
  border-left: 3px solid var(--staat);
  padding: 0.5rem 0.7rem;
  background: #1c1c1c;
  border-radius: 0 2px 2px 0;
}
.m-card.person { border-color: var(--gold); }
.m-card.international { border-color: var(--international); }
.m-card.beruf { border-color: var(--beruf); }
.m-cat { font-family: 'Oswald', sans-serif; font-size: 0.53rem; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.65; margin-bottom: 0.15rem; }
.m-card.staat .m-cat { color: var(--staat); }
.m-card.person .m-cat { color: var(--gold); }
.m-card.international .m-cat { color: var(--international); }
.m-card.beruf .m-cat { color: var(--beruf); }
.m-title { font-family: 'Oswald', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--creme); line-height: 1.3; margin-bottom: 0.3rem; }
.m-desc { font-size: 0.76rem; color: #999; line-height: 1.6; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">
      <div class="logo-emblem">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
          <circle cx="50" cy="50" r="48" fill="#CC0000" stroke="#D4A017" stroke-width="3"/>
          <circle cx="50" cy="50" r="40" fill="#0e0e0e"/>
          <g stroke="#D4A017" stroke-width="1.5" fill="none">
            <path d="M28 75 Q22 60 25 45"/><path d="M25 45 Q18 38 20 30"/>
            <path d="M25 45 Q20 40 16 38"/><path d="M25 45 Q22 38 22 33"/>
            <path d="M25 45 Q28 40 30 36"/><path d="M25 45 Q29 42 32 40"/>
          </g>
          <g stroke="#D4A017" stroke-width="1.5" fill="none">
            <path d="M72 75 Q78 60 75 45"/><path d="M75 45 Q82 38 80 30"/>
            <path d="M75 45 Q80 40 84 38"/><path d="M75 45 Q78 38 78 33"/>
            <path d="M75 45 Q72 40 70 36"/><path d="M75 45 Q71 42 68 40"/>
          </g>
          <rect x="42" y="50" width="16" height="5" rx="1" fill="#D4A017" transform="rotate(-30 50 52)"/>
          <rect x="48" y="40" width="4" height="18" rx="1" fill="#D4A017" transform="rotate(-30 50 52)"/>
          <line x1="55" y1="38" x2="62" y2="62" stroke="#D4A017" stroke-width="2" stroke-linecap="round"/>
          <line x1="55" y1="38" x2="48" y2="62" stroke="#D4A017" stroke-width="2" stroke-linecap="round"/>
          <line x1="50" y1="52" x2="60" y2="52" stroke="#D4A017" stroke-width="1.5"/>
          <path d="M28 75 Q50 85 72 75" stroke="#D4A017" stroke-width="2" fill="none"/>
        </svg>
      </div>
      <div>
        <div class="logo-title">DDR Kalender</div>
        <div class="logo-sub">Gedenk- &amp; Feiertage</div>
      </div>
    </div>
    <div class="header-right">
      <button class="install-btn" id="installBtn" title="App installieren">
        &#x2913; Installieren
      </button>
      <div class="year-nav">
        <button class="year-btn" id="prevYear">&#8592;</button>
        <div class="year-display" id="yearDisplay">2026</div>
        <button class="year-btn" id="nextYear">&#8594;</button>
      </div>
    </div>
  </div>

  <div class="nav-tabs">
    <div class="tab active" data-view="heute">Heute</div>
    <div class="tab" data-view="kalender">Jahreskalender</div>
  </div>

  <div class="filter-bar" id="filterBar" style="display:none">
    <span class="filter-label">Filter:</span>
    <div class="chip active" data-cat="all">Alle</div>
    <div class="chip" data-cat="staat"><span class="chip-dot" style="background:var(--staat)"></span>Staatsfeiertage</div>
    <div class="chip" data-cat="person"><span class="chip-dot" style="background:var(--gold)"></span>Personen</div>
    <div class="chip" data-cat="international"><span class="chip-dot" style="background:var(--international)"></span>International</div>
    <div class="chip" data-cat="beruf"><span class="chip-dot" style="background:var(--beruf)"></span>Berufstage</div>
  </div>
</header>

<main>
  <!-- ── HEUTE VIEW ── -->
  <div id="view-heute" class="active">
    <div class="heute-wrapper">
      <div class="heute-hero">
        <div class="heute-label">&#x25CF; Heute</div>
        <div class="heute-datum" id="heuteDatum"></div>
        <div class="heute-wochentag" id="heuteWT"></div>
        <div class="heute-day-count" id="heuteDayCount"></div>
      </div>

<script>
const ALL_EVENTS = {"2024":[{"date":"01-15","title":"Liebknecht & Luxemburg Gedenktag 🌹","desc":"Gedenktag für Karl Liebknecht und Rosa Luxemburg – am Sonntag, der dem 15. Januar am nächsten liegt. Beide wurden am 15. Januar 1919 ermordet. Jährliche Gedenkdemonstration in Berlin.","cat":"staat"},{"date":"02-11","title":"Tag der Werktätigen des Post- und Fernmeldewesens 📮","desc":"Ehrentag der Beschäftigten im Post- und Fernmeldewesen der DDR – zweiter Sonntag im Februar.","cat":"beruf"},{"date":"02-08","title":"Tag des MfS 🔍","desc":"Tag des Ministeriums für Staatssicherheit (MfS/Stasi) – gegründet am 8. Februar 1950. Inoffizieller Gedenktag innerhalb des Apparats.","cat":"staat"},{"date":"02-18","title":"Tag der Mitarbeiter des Handels 🛒","desc":"Ehrentag der Beschäftigten im Einzelhandel und Handelswesen der DDR – dritter Sonntag im Februar.","cat":"beruf"},{"date":"03-01","title":"Tag der NVA 🪖","desc":"Tag der Nationalen Volksarmee der DDR – begangen am 1. März. Gegründet am 1. März 1956. Gefeiert mit Paraden und Appellen.","cat":"staat"},{"date":"03-07","title":"Tag der FDJ 🔵","desc":"Jahrestag der Gründung der Freien Deutschen Jugend am 7. März 1946. Massenorganisation der DDR-Jugend. Gefeiert mit Appellen, Fackelzügen und kulturellen Veranstaltungen.","cat":"staat"},{"date":"03-08","title":"Internationaler Frauentag 👩","desc":"Internationaler Frauentag – offizieller Gedenk- und Feiertag der DDR. Beschäftigte Frauen erhielten häufig einen bezahlten arbeitsfreien Tag. Mit Blumen, Veranstaltungen und Auszeichnungen begangen.","cat":"international"},{"date":"03-19","title":"Jahrestag der Pariser Kommune 🏴","desc":"Jahrestag der Pariser Kommune vom 18. März 1871 – erstes Experiment einer Arbeiterregierung in der Geschichte. In der DDR als revolutionäres Vorbild gewürdigt.","cat":"staat"},{"date":"04-11","title":"Befreiung KZ Buchenwald 🕯️","desc":"Gedenktag zur Befreiung des Konzentrationslagers Buchenwald am 11. April 1945 durch US-amerikanische Truppen. Einer der zentralen Gedenkfeiern in der DDR – Buchenwald als nationales Mahnmal gepflegt.","cat":"staat"},{"date":"04-14","title":"Tag des Metallarbeiters ⚙️","desc":"Ehrentag der Metallarbeiterinnen und Metallarbeiter der DDR – zweiter Sonntag im April. Gefeiert in Betrieben der metallerzeugenden und metallverarbeitenden Industrie.","cat":"beruf"},{"date":"04-21","title":"Gründungstag der SED 🔴","desc":"Jahrestag der Gründung der Sozialistischen Einheitspartei Deutschlands (SED) am 21./22. April 1946 durch Zwangsvereinigung von SPD und KPD in der Sowjetischen Besatzungszone.","cat":"staat"},{"date":"04-22","title":"Geburtstag Lenin ☭","desc":"Wladimir Iljitsch Lenin wurde am 22. April 1870 in Simbirsk (heute Uljanowsk) geboren und starb 1924 mit 53 Jahren. Er wäre heute 154 Jahre alt. Begründer der Sowjetunion und theoretischer Vordenker des Marxismus-Leninismus. Gedenktag in Betrieben, Schulen und Parteiorganisationen.","cat":"person"},{"date":"05-01","title":"Tag der Arbeit ✊","desc":"Internationaler Kampf- und Feiertag der Werktätigen – 1. Mai. Größter politischer Feiertag im Frühling. Massenaufmärsche, Kundgebungen und Militärparaden in allen Städten der DDR.","cat":"staat"},{"date":"05-08","title":"Jahrestag der Befreiung 🕊️","desc":"Jahrestag der Befreiung vom Hitlerfaschismus am 8. Mai 1945 – Tag der bedingungslosen Kapitulation der Wehrmacht. In der DDR als 'Tag der Befreiung' begangen, nicht als Niederlage, sondern als Befreiung durch die Sowjetunion.","cat":"staat"},{"date":"05-09","title":"Tag des Sieges 🎖️","desc":"Tag des Sieges der Völker der UdSSR über den Hitlerfaschismus – 9. Mai 1945 (sowjetischer Kalender). In der DDR parallel zum 8. Mai als Ausdruck der engen Verbundenheit mit der Sowjetunion begangen.","cat":"staat"},{"date":"06-01","title":"Internationaler Kindertag 🎈","desc":"Internationaler Kindertag – 1. Juni. Einer der beliebtesten Feiertage in der DDR. Kinder erhielten Geschenke, Schulen und Betriebe organisierten Feste und Ausflüge.","cat":"international"},{"date":"06-12","title":"Tag des Lehrers 📚","desc":"Tag des Lehrers – 12. Juni. Ehrentag für Lehrerinnen und Lehrer in der DDR. Schülerinnen und Schüler überreichten Blumen und Geschenke, Schulen veranstalteten Feierstunden.","cat":"beruf"},{"date":"06-09","title":"Tag des Eisenbahners 🚂","desc":"Tag des Eisenbahners und der Werktätigen des Verkehrswesens – zweiter Sonntag im Juni. Ehrentag der Beschäftigten der Deutschen Reichsbahn und des gesamten Verkehrswesens.","cat":"beruf"},{"date":"05-18","title":"Tag der Jugendbrigaden 👷","desc":"Tag der Jugendbrigaden – Freitag vor Pfingsten (ab 1978). Ehrentag der sozialistischen Jugendbrigaden in Betrieben und Kombinaten der DDR. Auszeichnungen für herausragende Arbeitsleistungen junger Werktätiger.","cat":"staat"},{"date":"06-15","title":"Tag der Werktätigen der Wasserwirtschaft 💧","desc":"Tag der Werktätigen der Wasserwirtschaft – dritter Sonnabend im Juni. Ehrentag der Beschäftigten in Wasserversorgung, Abwasserwirtschaft und Gewässerschutz der DDR.","cat":"beruf"},{"date":"06-22","title":"Gedenktag: Überfall auf die Sowjetunion 🕯️","desc":"Jahrestag des deutschen Überfalls auf die Sowjetunion am 22. Juni 1941 – Beginn des 'Großen Vaterländischen Krieges'. In der DDR als Mahntag gegen Krieg und Faschismus begangen.","cat":"international"},{"date":"06-16","title":"Tag der Genossenschaftsbauern 🌾","desc":"Tag der Genossenschaftsbauern und Arbeiter der sozialistischen Land- und Forstwirtschaft – dritter Sonntag im Juni. Ehrentag der Beschäftigten in den Landwirtschaftlichen Produktionsgenossenschaften (LPG).","cat":"beruf"},{"date":"06-23","title":"Tag des Bauarbeiters 🏗️","desc":"Tag des Bauarbeiters – vierter Sonntag im Juni. Ehrentag der Beschäftigten im Bauwesen der DDR. Mit Betriebsfeiern und Auszeichnungen begangen.","cat":"beruf"},{"date":"07-01","title":"Tag der Deutschen Volkspolizei 🚔","desc":"Tag der Deutschen Volkspolizei – 1. Juli. Ehrentag der Volkspolizei der DDR. Begangen mit Appellen, Auszeichnungen und öffentlichen Veranstaltungen.","cat":"international"},{"date":"07-07","title":"Tag des Bergmanns und Energiearbeiters ⛏️","desc":"Tag des Bergmanns und des Energiearbeiters – erster Sonntag im Juli. Ehrentag der Beschäftigten im Bergbau und in der Energiewirtschaft. Besonders bedeutsam in den Braunkohlerevieren der DDR.","cat":"beruf"},{"date":"07-18","title":"Tag der Internationalen Brigaden 🌍","desc":"Tag der Internationalen Brigaden – 18. Juli. Gedenktag für die internationalen Freiwilligen, die im Spanischen Bürgerkrieg (1936–1939) gegen den Faschismus kämpften. In der DDR als antifaschistisches Symbol gewürdigt.","cat":"international"},{"date":"08-02","title":"Potsdamer Abkommen (1945) 📜","desc":"Jahrestag der Unterzeichnung des Potsdamer Abkommens am 2. August 1945 durch UdSSR, USA und Großbritannien. Regelte die Nachkriegsordnung Deutschlands. In der DDR als Grundlage der Nachkriegspolitik gewürdigt.","cat":"staat"},{"date":"08-07","title":"Gründung der GST (1952) 🚀","desc":"Jahrestag der Gründung der Gesellschaft für Sport und Technik (GST) am 7. August 1952. Paramilitärische Massenorganisation der DDR zur vormilitärischen Ausbildung von Jugendlichen.","cat":"staat"},{"date":"09-01","title":"Weltfriedenstag ☮️","desc":"Weltfriedenstag – 1. September. Jahrestag des Beginns des Zweiten Weltkriegs (1939). In der DDR als internationaler Antikriegstag und Friedensappell begangen.","cat":"international"},{"date":"09-08","title":"Weltalphabetisierungstag 📖","desc":"Weltalphabetisierungstag – 8. September. Internationaler Gedenktag für Bildung und Bekämpfung des Analphabetismus. In der DDR im Kontext der sozialistischen Bildungspolitik begangen.","cat":"staat"},{"date":"09-21","title":"Tag der haus- und kommunalwirtschaftlichen Dienstleistungen 🏘️","desc":"Tag der Werktätigen des Bereiches der haus- und kommunalwirtschaftlichen Dienstleistungen – dritter Sonnabend im September. Ehrentag der Beschäftigten in Hauswirtschaft, Wohnungswirtschaft und kommunalen Diensten.","cat":"beruf"},{"date":"09-08","title":"OdF-Tag – Gedenktag Opfer des Faschismus 🕯️","desc":"Internationaler Gedenktag für die Opfer des faschistischen Terrors und Kampftag gegen Faschismus und imperialistischen Krieg – zweiter Sonntag im September. Einer der bedeutendsten Gedenktage der DDR. Kranzniederlegungen, Gedenkfeiern an Mahnmalen.","cat":"international"},{"date":"10-09","title":"Weltposttag 📬","desc":"Weltposttag – 9. Oktober. Internationaler Gedenktag des Weltpostvereins. In der DDR im Zusammenhang mit dem Ehrentag der Post- und Fernmeldewerktätigen begangen.","cat":"international"},{"date":"10-13","title":"Tag der Seeverkehrswirtschaft ⚓","desc":"Tag der Seeverkehrswirtschaft – 13. Oktober. Ehrentag der Beschäftigten in der Seefahrt und Binnenschifffahrt der DDR. Bedeutsam für Rostock und die Ostseehäfen.","cat":"beruf"},{"date":"10-16","title":"Welternährungstag 🌽","desc":"Welternährungstag – 16. Oktober. Internationaler Gedenktag der FAO. In der DDR im Kontext sozialistischer Landwirtschaftspolitik und internationaler Solidarität begangen.","cat":"staat"},{"date":"10-19","title":"Tag der Leicht- und Lebensmittelindustrie 🏭","desc":"Tag der Werktätigen der Leicht-, Lebensmittel- und Nahrungsgüterindustrie – dritter Sonnabend im Oktober. Ehrentag der Beschäftigten in der Konsumgüter- und Nahrungsmittelproduktion der DDR.","cat":"beruf"},{"date":"10-24","title":"Tag der Vereinten Nationen 🌐","desc":"Tag der Vereinten Nationen – 24. Oktober. Jahrestag des Inkrafttretens der UN-Charta (1945). Die DDR trat den Vereinten Nationen 1973 bei und nutzte den Tag für Bekenntnisse zu Frieden und internationaler Zusammenarbeit.","cat":"international"},{"date":"10-07","title":"Tag der Republik 🇩🇪","desc":"Am 21. April 1950 wurde der Nationalfeiertag der Deutschen Demokratischen Republik am 7. Oktober zum bedeutendsten Staatsfeiertag der DDR erklärt. Seitdem wurde er jährlich in Berlin festlich mit einem Staatsakt und einer Militärparade begangen. In der ganzen Republik feierte das Volk mit staatlich organisierten Demonstrationen, Festveranstaltungen und Fackelzügen der FDJ den Tag der Republik. An diesem Tag wurden auch die Nationalpreise der DDR an verdiente Künstler, Wissenschaftler, Techniker und Aktivisten verliehen. Zu runden Jahrestagen gab besonders große Feierlichkeiten. Außerdem wurden alle fünf Jahre Sonderbriefmarken zum Staatsgeburtstag der DDR herausgegeben.","cat":"staat"},{"date":"11-07","title":"Jahrestag der Oktoberrevolution ☭","desc":"Jahrestag der Großen Sozialistischen Oktoberrevolution vom 7. November 1917. Wichtigster ideologischer Feiertag der DDR nach dem Tag der Republik. Kundgebungen, Feierstunden in Betrieben, Schulen und Parteiorganisationen.","cat":"staat"},{"date":"11-10","title":"Gründung des WBDJ / Weltjugendtag 🌍","desc":"Jahrestag der Gründung des Weltbundes der Demokratischen Jugend (WBDJ) am 10. November 1945 in London. Weltjugendtag – in der DDR als Zeichen internationaler Jugendbewegung und sozialistischer Solidarität begangen.","cat":"international"},{"date":"11-17","title":"Internationaler Studententag 🎓","desc":"Internationaler Studententag – 17. November. Gedenktag für die Opfer der nationalsozialistischen Repression gegen tschechische Studenten 1939. In der DDR als antifaschistischer Kampftag der Studentenbewegung begangen.","cat":"international"},{"date":"11-17","title":"Tag der Militärjustizorgane ⚖️","desc":"Tag der Militärjustizorgane der DDR – 17. November. Ehrentag der Beschäftigten in der Militärjustiz der Nationalen Volksarmee.","cat":"international"},{"date":"11-29","title":"Solidaritätstag mit dem palästinensischen Volk 🫱","desc":"Internationaler Tag der Solidarität mit dem palästinensischen Volk – 29. November. Von der UN-Generalversammlung 1977 ausgerufen. Die DDR unterhielt enge Beziehungen zur PLO und beging diesen Tag offiziell.","cat":"international"},{"date":"11-10","title":"Tag des Chemiearbeiters 🧪","desc":"Tag des Chemiearbeiters – zweiter Sonntag im November. Ehrentag der Beschäftigten in der chemischen Industrie der DDR, einem der wichtigsten Wirtschaftszweige.","cat":"beruf"},{"date":"11-17","title":"Tag des Metallurgen 🔩","desc":"Tag des Metallurgen – dritter Sonntag im November. Ehrentag der Beschäftigten in der Hüttenindustrie und Metallurgie der DDR.","cat":"beruf"},{"date":"12-01","title":"Tag der Grenztruppen der DDR 🛡️","desc":"Tag der Grenztruppen der DDR – 1. Dezember. Ehrentag der Grenzsoldaten, die die Staatsgrenze der DDR sicherten. Begangen mit Appellen und Auszeichnungen.","cat":"staat"},{"date":"12-11","title":"Tag des Gesundheitswesens 🏥","desc":"Tag des Gesundheitswesens – 11. Dezember. Ehrentag der Beschäftigten im Gesundheits- und Sozialwesen der DDR. Auszeichnungen für herausragende Leistungen in der medizinischen Versorgung.","cat":"beruf"},{"date":"12-13","title":"Pioniergeburtstag 🔴","desc":"Jahrestag der Gründung der Pionierorganisation Ernst Thälmann am 13. Dezember 1948. Massenorganisation für Kinder und Jugendliche der DDR (6–14 Jahre). Gefeiert mit Appellen, kulturellen Veranstaltungen und Aufnahmezeremonien.","cat":"person"},{"date":"12-30","title":"KPD-Gründung (1918) ✊","desc":"Jahrestag der Gründung der Kommunistischen Partei Deutschlands (KPD) am 30. Dezember 1918 in Berlin. Mitgegründet von Rosa Luxemburg und Karl Liebknecht. Ideologischer Ursprungsfeiertag der SED.","cat":"international"},{"date":"12-30","title":"Gründung der UdSSR (1922) ☭","desc":"Jahrestag der Gründung der Union der Sozialistischen Sowjetrepubliken (UdSSR) am 30. Dezember 1922. In der DDR als Jubiläum des ersten sozialistischen Staates gewürdigt. Die Sowjetunion war ein von der KPdSU zentralistisch regierter, föderativer Vielvölkerstaat, dessen Territorium sich über Osteuropa, den Kaukasus, Zentral- und über das gesamte Nordasien erstreckte. Zu den 15 Unionsrepubliken der UdSSR gehörten die Russische SFSR, die Ukrainische SSR, die Weißrussische SSR, die Usbekische SSR, die Kasachische SSR, die Georgische SSR, die Aserbaidschanische SSR, die Litauische SSR, die Moldauische SSR, die Lettische SSR, die Kirgisische SSR, die Tadschikische SSR, die Armenische SSR, die Turkmenische SSR und die Estnische SSR.","cat":"staat"},{"date":"02-11","title":"Tag der Zivilverteidigung 🪖","desc":"Tag der Zivilverteidigung der DDR – 11. Februar. Ehrentag der Zivilschutzorgane und Bevölkerungsschutzeinrichtungen. Begangen mit Übungen und Auszeichnungen.","cat":"staat"},{"date":"03-21","title":"Internationaler Tag gegen Rassendiskriminierung ✊","desc":"Internationaler Tag für die Beseitigung der Rassendiskriminierung – 21. März. Gedenkt dem Massaker von Sharpeville (1960). In der DDR als antiimperialistischer Kampftag und Zeichen der Solidarität mit den unterdrückten Völkern begangen.","cat":"international"},{"date":"03-23","title":"Welttag der Meteorologie 🌤️","desc":"Welttag der Meteorologie – 23. März. Internationaler Gedenktag der Weltorganisation für Meteorologie (WMO). In der DDR im Kontext des wissenschaftlich-technischen Fortschritts begangen.","cat":"international"},{"date":"03-27","title":"Welttheatertag 🎭","desc":"Welttheatertag – 27. März. Internationaler Gedenktag des Theaterlebens, ausgerufen vom Internationalen Theaterinstitut (ITI). In der DDR mit Aufführungen und Festveranstaltungen an Theatern begangen.","cat":"international"},{"date":"04-07","title":"Weltgesundheitstag 🏥","desc":"Weltgesundheitstag – 7. April. Jahrestag der Gründung der Weltgesundheitsorganisation (WHO, 1948). In der DDR mit Veranstaltungen zur sozialistischen Gesundheitspolitik und kostenloser Grundversorgung begangen.","cat":"international"},{"date":"04-18","title":"Internationaler Denkmaltag 🏛️","desc":"Internationaler Denkmaltag – 18. April. Tag des kulturellen Erbes, ausgerufen vom Internationalen Rat für Denkmalpflege (ICOMOS). In der DDR im Kontext der Denkmalpflege und des sozialistischen Kulturerbes begangen.","cat":"international"},{"date":"04-24","title":"Internationaler Tag der Jugend gegen Kolonialismus 🌍","desc":"Internationaler Tag der Jugend und Studenten gegen Kolonialismus und für friedliche Koexistenz – 24. April. In der DDR als antikolonialer Solidaritätstag begangen.","cat":"international"},{"date":"05-08","title":"Weltrotkreuztag 🏥 🔴","desc":"Weltrotkreuztag – 8. Mai. Geburtstag von Henri Dunant, dem Gründer des Roten Kreuzes (1828). In der DDR durch das Deutsche Rote Kreuz (DRK) mit Veranstaltungen und Spendenaktionen begangen.","cat":"international"},{"date":"05-10","title":"Tag des freien Buches 📚","desc":"Tag des freien Buches – 10. Mai. Gedenktag im Andenken an die Bücherverbrennung durch die Nationalsozialisten am 10. Mai 1933 in Deutschland. In der DDR als antifaschistischer Kulturtag begangen.","cat":"international"},{"date":"05-17","title":"Weltfernmeldetag 📡","desc":"Weltfernmeldetag – 17. Mai. Jahrestag der Gründung der Internationalen Fernmeldeunion (ITU, 1865). In der DDR im Zusammenhang mit dem Ehrentag der Post- und Fernmeldewerktätigen begangen.","cat":"international"},{"date":"05-18","title":"Internationaler Museumstag 🏛️","desc":"Internationaler Museumstag – 18. Mai. Ausgerufen vom Internationalen Museumsrat (ICOM). In der DDR mit kostenlosen Museumseintritten, Sonderführungen und kulturellen Veranstaltungen begangen.","cat":"international"},{"date":"06-05","title":"Weltumwelttag 🌿","desc":"Weltumwelttag – 5. Juni. Ausgerufen von den Vereinten Nationen seit 1972. In der DDR im Kontext des sozialistischen Umweltschutzes und der Naturpflege begangen.","cat":"international"},{"date":"10-01","title":"Weltmusiktag 🎵","desc":"Weltmusiktag – 1. Oktober. Internationaler Gedenktag der Musik, begangen in vielen sozialistischen Ländern. In der DDR mit Konzerten, Musikfestivals und kulturellen Veranstaltungen begangen.","cat":"international"},{"date":"01-03","title":"Geburtstag Wilhelm Pieck (1876) 🕯️","desc":"Wilhelm Pieck wurde am 3. Januar 1876 in Guben geboren und starb 1960 mit 84 Jahren. Er wäre heute 148 Jahre alt. Erster und einziger Staatspräsident der DDR (1949–1960), Mitgründer der KPD und der SED. Nach ihm wurden viele Straßen, Betriebe und Einrichtungen in der DDR benannt.","cat":"person"},{"date":"01-21","title":"Todestag Lenin (1924) 🕯️","desc":"Wladimir Iljitsch Lenin, geboren im Jahre 1870, verstarb am 21. Januar 1924 in Gorki Leninskie. Er wurde 53 Jahre alt. Begründer der Sowjetunion und des Marxismus-Leninismus. In der DDR mit Gedenkfeiern in Betrieben, Schulen und Parteiorganisationen begangen.","cat":"person"},{"date":"03-05","title":"Geburtstag Rosa Luxemburg (1871) 🌹","desc":"Rosa Luxemburg wurde am 5. März 1871 in Zamość (Russisches Kaiserreich, heute Polen) geboren und wurde 1919 mit 47 Jahren ermordet. Sie wäre heute 153 Jahre alt. Mitbegründerin der KPD, revolutionäre Sozialistin und Theoretikerin. Am 15. Januar 1919 ermordet. In der DDR als Märtyrerin der Arbeiterbewegung verehrt.","cat":"person"},{"date":"03-11","title":"Geburtstag Otto Grotewohl (1894) 🕯️","desc":"Otto Grotewohl wurde am 11. März 1894 in Braunschweig geboren und starb 1964 mit 70 Jahren. Er wäre heute 130 Jahre alt. Erster Ministerpräsident der DDR (1949–1964), führte die SPD in der Sowjetischen Besatzungszone in die Zwangsvereinigung mit der KPD zur SED (1946).","cat":"person"},{"date":"03-14","title":"Todestag Karl Marx (1883) 🕯️","desc":"Karl Marx, geboren im Jahre 1818, verstarb am 14. März 1883 in London. Er wurde 64 Jahre alt. Begründer des wissenschaftlichen Sozialismus gemeinsam mit Friedrich Engels. Autor des Kommunistischen Manifests (1848) und des Kapitals. Ideologisches Fundament der DDR.","cat":"person"},{"date":"04-16","title":"Geburtstag Ernst Thälmann (1886) ✊","desc":"Ernst Thälmann wurde am 16. April 1886 in Hamburg geboren und wurde 1944 mit 57 Jahren ermordet. Er wäre heute 138 Jahre alt. Vorsitzender der KPD (1925–1933), inhaftiert von den Nationalsozialisten 1933, am 18. August 1944 im KZ Buchenwald ermordet. Zentrales Heldenbild der DDR – nach ihm wurde die Pionierorganisation benannt.","cat":"person"},{"date":"05-05","title":"Geburtstag Karl Marx (1818) 🕯️","desc":"Karl Marx wurde am 5. Mai 1818 in Trier geboren und starb 1883 mit 64 Jahren. Er wäre heute 206 Jahre alt. Philosoph, Ökonom und revolutionärer Theoretiker. Seine Schriften bildeten die ideologische Grundlage des Marxismus-Leninismus und damit der gesamten DDR-Staatsideologie.","cat":"person"},{"date":"06-30","title":"Geburtstag Walter Ulbricht (1893) 🕯️","desc":"Walter Ulbricht wurde am 30. Juni 1893 in Leipzig geboren und starb 1973 mit 80 Jahren. Er wäre heute 131 Jahre alt. Erster Sekretär der SED (1950–1971) und Vorsitzender des Staatsrats (1960–1973). Maßgeblich für den Aufbau der DDR verantwortlich, ordnete den Mauerbau 1961 an. Gestorben am 1. August 1973.","cat":"person"},{"date":"08-05","title":"Todestag Friedrich Engels (1895) 🕯️","desc":"Friedrich Engels, geboren im Jahre 1820, verstarb am 5. August 1895 in London. Er wurde 74 Jahre alt. Mitbegründer des wissenschaftlichen Sozialismus gemeinsam mit Karl Marx. Finanzierte Marx' Arbeit und vollendete das Kapital nach dessen Tod. Ideologisches Fundament der DDR.","cat":"person"},{"date":"08-13","title":"Geburtstag Karl Liebknecht (1871) 🕯️","desc":"Karl Liebknecht wurde am 13. August 1871 in Leipzig geboren und wurde 1919 mit 47 Jahren ermordet. Er wäre heute 153 Jahre alt. Mitbegründer der KPD, erklärte am 9. November 1918 die Freie Sozialistische Republik Deutschland. Am 15. Januar 1919 gemeinsam mit Rosa Luxemburg ermordet.","cat":"person"},{"date":"08-13","title":"Jahrestag des Mauerbaus (1961) 🧱","desc":"Jahrestag der Sicherung der Staatsgrenze der DDR am 13. August 1961 – in der DDR offiziell als notwendige Schutzmaßnahme gegen den 'Imperialismus' bezeichnet. Beginn des Baus der Berliner Mauer. In der DDR als Stabilisierung des sozialistischen Staates propagiert.","cat":"staat"},{"date":"08-18","title":"Ermordung Ernst Thälmanns (1944) 🕯️","desc":"Ernst Thälmann, geboren im Jahre 1886, wurde am 18. August 1944 im KZ Buchenwald ermordet. Er wurde 57 Jahre alt. Auf Befehl Hitlers erschossen. Zentrales Märtyrerdatum der DDR-Gedenkkultur. Mit Gedenkfeiern, Kranzniederlegungen und Appellen der Pionierorganisation begangen.","cat":"person"},{"date":"11-28","title":"Geburtstag Friedrich Engels (1820) 🕯️","desc":"Friedrich Engels wurde am 28. November 1820 in Barmen (heute Wuppertal) geboren und starb 1895 mit 74 Jahren. Er wäre heute 204 Jahre alt. Mitbegründer des Marxismus, enger Weggefährte von Karl Marx. Ideologisches Fundament der DDR-Staatsideologie.","cat":"person"},{"date":"09-07","title":"Todestag Wilhelm Pieck (1960) 🕯️","desc":"Wilhelm Pieck, geboren im Jahre 1876, verstarb am 7. September 1960 in Moskau. Er wurde 84 Jahre alt. Erster und einziger Staatspräsident der DDR (1949–1960), Mitgründer der KPD und der SED. Nach seinem Tod wurde das Amt des Staatspräsidenten abgeschafft und durch den Staatsrat ersetzt.","cat":"person"},{"date":"09-21","title":"Todestag Otto Grotewohl (1964) 🕯️","desc":"Otto Grotewohl, geboren im Jahre 1894, verstarb am 21. September 1964 in Ost-Berlin. Er wurde 70 Jahre alt. Erster Ministerpräsident der DDR (1949–1964), führte die SPD in der Sowjetischen Besatzungszone in die Zwangsvereinigung mit der KPD zur SED (1946).","cat":"person"},{"date":"08-01","title":"Todestag Walter Ulbricht (1973) 🕯️","desc":"Walter Ulbricht, geboren im Jahre 1893, verstarb am 1. August 1973 am Döllnsee in Brandenburg. Er wurde 80 Jahre alt. Erster Sekretär der SED (1950–1971) und Vorsitzender des Staatsrats (1960–1973). Maßgeblich für den Aufbau der DDR verantwortlich, ordnete den Mauerbau 1961 an.","cat":"person"},{"date":"08-25","title":"Geburtstag Erich Honecker (1912) 🕯️","desc":"Erich Honecker wurde am 25. August 1912 in Neunkirchen (Saar) geboren und starb 1994 mit 81 Jahren. Er wäre heute 112 Jahre alt. Generalsekretär der SED und Vorsitzender des Staatsrats (1971–1989), prägte die DDR in ihrer Spätphase. Verantwortlich für den Schießbefehl an der Grenze. Floh 1991 nach Chile, wo er 1994 verstarb.","cat":"person"},{"date":"05-29","title":"Todestag Erich Honecker (1994) 🕯️","desc":"Erich Honecker, geboren im Jahre 1912, verstarb am 29. Mai 1994 in Santiago de Chile. Er wurde 81 Jahre alt. Generalsekretär der SED und Vorsitzender des Staatsrats der DDR (1971–1989). Nach dem Mauerfall angeklagt, floh er 1991 in die chilenische Botschaft in Moskau und später nach Chile, wo er an Leberkrebs starb.","cat":"person"},{"date":"04-17","title":"Geburtstag Margot Honecker (1927) 🕯️","desc":"Margot Honecker wurde am 17. April 1927 in Halle (Saale) geboren und starb 2016 mit 89 Jahren. Sie wäre heute 97 Jahre alt. Ministerin für Volksbildung der DDR (1963–1989), eine der mächtigsten Frauen des Staates. Ehefrau von Erich Honecker. Verantwortlich für das sozialistische Bildungssystem der DDR. Floh nach dem Mauerfall nach Chile, wo sie 2016 verstarb.","cat":"person"},{"date":"05-06","title":"Todestag Margot Honecker (2016) 🕯️","desc":"Margot Honecker, geboren im Jahre 1927, verstarb am 6. Mai 2016 in Santiago de Chile. Sie wurde 89 Jahre alt. Ministerin für Volksbildung der DDR (1963–1989), prägte das sozialistische Schul- und Erziehungswesen. Nach dem Mauerfall floh sie gemeinsam mit Erich Honecker nach Chile, wo sie bis zu ihrem Tod lebte.","cat":"person"},{"date":"03-19","title":"Geburtstag Egon Krenz (1937) 🕯️","desc":"Egon Krenz wurde am 19. März 1937 in Kołobrzeg (damals Kolberg, heute Polen) geboren. Er ist heute 87 Jahre alt. Letzter Generalsekretär der SED und Vorsitzender des Staatsrats der DDR (Oktober–Dezember 1989). Langjähriger FDJ-Vorsitzender (1974–1983), galt als designierter Nachfolger Honeckers. Öffnete am 9. November 1989 die Berliner Mauer. 1997 wegen Totschlags an Mauerflüchtlingen verurteilt.","cat":"person"},{"date":"12-28","title":"Geburtstag Erich Mielke (1907) 🕯️","desc":"Erich Mielke wurde am 28. Dezember 1907 in Berlin geboren und starb 2000 mit 92 Jahren. Er wäre heute 117 Jahre alt. Minister für Staatssicherheit der DDR (1957–1989), Chef der Stasi. Baute den DDR-Geheimdienst zu einem der effektivsten Überwachungsapparate der Welt aus. 1993 wegen Mordes an zwei Polizisten im Jahr 1931 verurteilt.","cat":"person"},{"date":"05-21","title":"Todestag Erich Mielke (2000) 🕯️","desc":"Erich Mielke, geboren im Jahre 1907, verstarb am 21. Mai 2000 in Berlin. Er wurde 92 Jahre alt. Minister für Staatssicherheit der DDR (1957–1989). Unter seiner Führung beschäftigte die Stasi über 90.000 hauptamtliche Mitarbeiter und rund 170.000 inoffizielle Informanten. Nach der Wende wegen Mordes verurteilt, wegen Verhandlungsunfähigkeit jedoch vorzeitig entlassen.","cat":"person"},{"date":"01-15","title":"Ermordung Rosa Luxemburg (1919) 🌹","desc":"Rosa Luxemburg, geboren im Jahre 1871, wurde am 15. Januar 1919 in Berlin ermordet. Sie wurde 47 Jahre alt. Mitbegründerin der KPD, revolutionäre Sozialistin und Theoretikerin. Nach dem Spartakusaufstand von Freikorpssoldaten verhaftet, misshandelt und erschossen. Ihre Leiche wurde in den Landwehrkanal geworfen. In der DDR als Märtyrerin der Arbeiterbewegung verehrt.","cat":"person"},{"date":"01-15","title":"Ermordung Karl Liebknecht (1919) 🕯️","desc":"Karl Liebknecht, geboren im Jahre 1871, wurde am 15. Januar 1919 in Berlin ermordet. Er wurde 47 Jahre alt. Mitbegründer der KPD, erklärte am 9. November 1918 die Freie Sozialistische Republik Deutschland. Nach dem Spartakusaufstand von Freikorpssoldaten verhaftet, misshandelt und erschossen. In der DDR als Märtyrer der Arbeiterbewegung verehrt.","cat":"person"},{"date":"03-17","title":"Weltschifffahrtstag 🚢","desc":"Weltschifffahrtstag – 17. März. Internationaler Gedenktag der Schifffahrt, ausgerufen von der Internationalen Seeschifffahrts-Organisation (IMO). In der DDR im Kontext der Seeverkehrswirtschaft und des Rostocker Hafens begangen.","cat":"international"},{"date":"04-12","title":"Tag der Luft- und Raumfahrt 🚀","desc":"Tag der Luft- und Raumfahrt – 12. April. Jahrestag des ersten bemannten Weltraumflugs durch Juri Gagarin am 12. April 1961. In der DDR mit Veranstaltungen in Schulen, Betrieben und Planetarien begangen. Besonders bedeutsam nach dem gemeinsamen Weltraumflug von Sigmund Jähn am 26. August 1978, dem ersten Deutschen im Weltall.","cat":"beruf"},{"date":"04-12","title":"Tag der Jungen Techniker und Naturforscher 🔬","desc":"Tag der Jungen Techniker und Naturforscher – 12. April. Ehrentag der Kinder und Jugendlichen, die sich in den Arbeitsgemeinschaften für Technik, Naturwissenschaft und Astronomie engagierten. Organisiert durch die Pionierorganisation Ernst Thälmann und die Gesellschaft für Sport und Technik (GST). Begleitet von Ausstellungen, Wettbewerben und Vorführungen.","cat":"beruf"},{"date":"04-23","title":"Welttag des Buches 📖","desc":"Welttag des Buches – 23. April. Internationaler Gedenktag für Literatur und das Lesen. In der DDR im Kontext der sozialistischen Bildungspolitik und des staatlichen Verlagswesens begangen. Die DDR hatte eine der höchsten Lesequoten der Welt.","cat":"international"},{"date":"04-28","title":"Welttag der Partnerstädte 🤝","desc":"Welttag der Partnerstädte – letzter Sonntag im April. Internationaler Gedenktag der Städtepartnerschaften, ausgerufen vom Weltverband der Partnerstädte (WFUCA). In der DDR wurden Partnerschaften vor allem mit sozialistischen Städten in der UdSSR, Polen, der Tschechoslowakei und anderen Bruderstaaten gepflegt.","cat":"international"},{"date":"06-16","title":"Tag der Solidarität mit Südafrika ✊","desc":"Tag der Solidarität mit dem Kampf des Volkes von Südafrika – 16. Juni. Gedenktag im Andenken an den Soweto-Aufstand vom 16. Juni 1976, bei dem südafrikanische Schüler gegen die Apartheidpolitik protestierten und von der Polizei erschossen wurden. In der DDR als antiimperialistischer Solidaritätstag begangen.","cat":"international"}],"2025":[{"date":"01-13","title":"Liebknecht & Luxemburg Gedenktag 🌹","desc":"Gedenktag für Karl Liebknecht und Rosa Luxemburg – am Sonntag, der dem 15. Januar am nächsten liegt. Beide wurden am 15. Januar 1919 ermordet. Jährliche Gedenkdemonstration in Berlin.","cat":"staat"},{"date":"02-09","title":"Tag der Werktätigen des Post- und Fernmeldewesens 📮","desc":"Ehrentag der Beschäftigten im Post- und Fernmeldewesen der DDR – zweiter Sonntag im Februar.","cat":"beruf"},{"date":"02-08","title":"Tag des MfS 🔍","desc":"Tag des Ministeriums für Staatssicherheit (MfS/Stasi) – gegründet am 8. Februar 1950. Inoffizieller Gedenktag innerhalb des Apparats.","cat":"staat"},{"date":"02-16","title":"Tag der Mitarbeiter des Handels 🛒","desc":"Ehrentag der Beschäftigten im Einzelhandel und Handelswesen der DDR – dritter Sonntag im Februar.","cat":"beruf"},{"date":"03-01","title":"Tag der NVA 🪖","desc":"Tag der Nationalen Volksarmee der DDR – begangen am 1. März. Gegründet am 1. März 1956. Gefeiert mit Paraden und Appellen.","cat":"staat"},{"date":"03-07","title":"Tag der FDJ 🔵","desc":"Jahrestag der Gründung der Freien Deutschen Jugend am 7. März 1946. Massenorganisation der DDR-Jugend. Gefeiert mit Appellen, Fackelzügen und kulturellen Veranstaltungen.","cat":"staat"},{"date":"03-08","title":"Internationaler Frauentag 👩","desc":"Internationaler Frauentag – offizieller Gedenk- und Feiertag der DDR. Beschäftigte Frauen erhielten häufig einen bezahlten arbeitsfreien Tag. Mit Blumen, Veranstaltungen und Auszeichnungen begangen.","cat":"international"},{"date":"03-19","title":"Jahrestag der Pariser Kommune 🏴","desc":"Jahrestag der Pariser Kommune vom 18. März 1871 – erstes Experiment einer Arbeiterregierung in der Geschichte. In der DDR als revolutionäres Vorbild gewürdigt.","cat":"staat"},{"date":"04-11","title":"Befreiung KZ Buchenwald 🕯️","desc":"Gedenktag zur Befreiung des Konzentrationslagers Buchenwald am 11. April 1945 durch US-amerikanische Truppen. Einer der zentralen Gedenkfeiern in der DDR – Buchenwald als nationales Mahnmal gepflegt.","cat":"staat"},{"date":"04-13","title":"Tag des Metallarbeiters ⚙️","desc":"Ehrentag der Metallarbeiterinnen und Metallarbeiter der DDR – zweiter Sonntag im April. Gefeiert in Betrieben der metallerzeugenden und metallverarbeitenden Industrie.","cat":"beruf"},{"date":"04-21","title":"Gründungstag der SED 🔴","desc":"Jahrestag der Gründung der Sozialistischen Einheitspartei Deutschlands (SED) am 21./22. April 1946 durch Zwangsvereinigung von SPD und KPD in der Sowjetischen Besatzungszone.","cat":"staat"},{"date":"04-22","title":"Geburtstag Lenin ☭","desc":"Wladimir Iljitsch Lenin wurde am 22. April 1870 in Simbirsk (heute Uljanowsk) geboren und starb 1924 mit 53 Jahren. Er wäre heute 155 Jahre alt. Begründer der Sowjetunion und theoretischer Vordenker des Marxismus-Leninismus. Gedenktag in Betrieben, Schulen und Parteiorganisationen.","cat":"person"},{"date":"05-01","title":"Tag der Arbeit ✊","desc":"Internationaler Kampf- und Feiertag der Werktätigen – 1. Mai. Größter politischer Feiertag im Frühling. Massenaufmärsche, Kundgebungen und Militärparaden in allen Städten der DDR.","cat":"staat"},{"date":"05-08","title":"Jahrestag der Befreiung 🕊️","desc":"Jahrestag der Befreiung vom Hitlerfaschismus am 8. Mai 1945 – Tag der bedingungslosen Kapitulation der Wehrmacht. In der DDR als 'Tag der Befreiung' begangen, nicht als Niederlage, sondern als Befreiung durch die Sowjetunion.","cat":"staat"},{"date":"05-09","title":"Tag des Sieges 🎖️","desc":"Tag des Sieges der Völker der UdSSR über den Hitlerfaschismus – 9. Mai 1945 (sowjetischer Kalender). In der DDR parallel zum 8. Mai als Ausdruck der engen Verbundenheit mit der Sowjetunion begangen.","cat":"staat"},{"date":"06-01","title":"Internationaler Kindertag 🎈","desc":"Internationaler Kindertag – 1. Juni. Einer der beliebtesten Feiertage in der DDR. Kinder erhielten Geschenke, Schulen und Betriebe organisierten Feste und Ausflüge.","cat":"international"},{"date":"06-12","title":"Tag des Lehrers 📚","desc":"Tag des Lehrers – 12. Juni. Ehrentag für Lehrerinnen und Lehrer in der DDR. Schülerinnen und Schüler überreichten Blumen und Geschenke, Schulen veranstalteten Feierstunden.","cat":"beruf"},{"date":"06-08","title":"Tag des Eisenbahners 🚂","desc":"Tag des Eisenbahners und der Werktätigen des Verkehrswesens – zweiter Sonntag im Juni. Ehrentag der Beschäftigten der Deutschen Reichsbahn und des gesamten Verkehrswesens.","cat":"beruf"},{"date":"06-07","title":"Tag der Jugendbrigaden 👷","desc":"Tag der Jugendbrigaden – Freitag vor Pfingsten (ab 1978). Ehrentag der sozialistischen Jugendbrigaden in Betrieben und Kombinaten der DDR. Auszeichnungen für herausragende Arbeitsleistungen junger Werktätiger.","cat":"staat"},{"date":"06-21","title":"Tag der Werktätigen der Wasserwirtschaft 💧","desc":"Tag der Werktätigen der Wasserwirtschaft – dritter Sonnabend im Juni. Ehrentag der Beschäftigten in Wasserversorgung, Abwasserwirtschaft und Gewässerschutz der DDR.","cat":"beruf"},{"date":"06-22","title":"Gedenktag: Überfall auf die Sowjetunion 🕯️","desc":"Jahrestag des deutschen Überfalls auf die Sowjetunion am 22. Juni 1941 – Beginn des 'Großen Vaterländischen Krieges'. In der DDR als Mahntag gegen Krieg und Faschismus begangen.","cat":"international"},{"date":"06-15","title":"Tag der Genossenschaftsbauern 🌾","desc":"Tag der Genossenschaftsbauern und Arbeiter der sozialistischen Land- und Forstwirtschaft – dritter Sonntag im Juni. Ehrentag der Beschäftigten in den Landwirtschaftlichen Produktionsgenossenschaften (LPG).","cat":"beruf"},{"date":"06-22","title":"Tag des Bauarbeiters 🏗️","desc":"Tag des Bauarbeiters – vierter Sonntag im Juni. Ehrentag der Beschäftigten im Bauwesen der DDR. Mit Betriebsfeiern und Auszeichnungen begangen.","cat":"beruf"},{"date":"07-01","title":"Tag der Deutschen Volkspolizei 🚔","desc":"Tag der Deutschen Volkspolizei – 1. Juli. Ehrentag der Volkspolizei der DDR. Begangen mit Appellen, Auszeichnungen und öffentlichen Veranstaltungen.","cat":"international"},{"date":"07-06","title":"Tag des Bergmanns und Energiearbeiters ⛏️","desc":"Tag des Bergmanns und des Energiearbeiters – erster Sonntag im Juli. Ehrentag der Beschäftigten im Bergbau und in der Energiewirtschaft. Besonders bedeutsam in den Braunkohlerevieren der DDR.","cat":"beruf"},{"date":"07-18","title":"Tag der Internationalen Brigaden 🌍","desc":"Tag der Internationalen Brigaden – 18. Juli. Gedenktag für die internationalen Freiwilligen, die im Spanischen Bürgerkrieg (1936–1939) gegen den Faschismus kämpften. In der DDR als antifaschistisches Symbol gewürdigt.","cat":"international"},{"date":"08-02","title":"Potsdamer Abkommen (1945) 📜","desc":"Jahrestag der Unterzeichnung des Potsdamer Abkommens am 2. August 1945 durch UdSSR, USA und Großbritannien. Regelte die Nachkriegsordnung Deutschlands. In der DDR als Grundlage der Nachkriegspolitik gewürdigt.","cat":"staat"},{"date":"08-07","title":"Gründung der GST (1952) 🚀","desc":"Jahrestag der Gründung der Gesellschaft für Sport und Technik (GST) am 7. August 1952. Paramilitärische Massenorganisation der DDR zur vormilitärischen Ausbildung von Jugendlichen.","cat":"staat"},{"date":"09-01","title":"Weltfriedenstag ☮️","desc":"Weltfriedenstag – 1. September. Jahrestag des Beginns des Zweiten Weltkriegs (1939). In der DDR als internationaler Antikriegstag und Friedensappell begangen.","cat":"international"},{"date":"09-08","title":"Weltalphabetisierungstag 📖","desc":"Weltalphabetisierungstag – 8. September. Internationaler Gedenktag für Bildung und Bekämpfung des Analphabetismus. In der DDR im Kontext der sozialistischen Bildungspolitik begangen.","cat":"staat"},{"date":"09-20","title":"Tag der haus- und kommunalwirtschaftlichen Dienstleistungen 🏘️","desc":"Tag der Werktätigen des Bereiches der haus- und kommunalwirtschaftlichen Dienstleistungen – dritter Sonnabend im September. Ehrentag der Beschäftigten in Hauswirtschaft, Wohnungswirtschaft und kommunalen Diensten.","cat":"beruf"},{"date":"09-14","title":"OdF-Tag – Gedenktag Opfer des Faschismus 🕯️","desc":"Internationaler Gedenktag für die Opfer des faschistischen Terrors und Kampftag gegen Faschismus und imperialistischen Krieg – zweiter Sonntag im September. Einer der bedeutendsten Gedenktage der DDR. Kranzniederlegungen, Gedenkfeiern an Mahnmalen.","cat":"international"},{"date":"10-09","title":"Weltposttag 📬","desc":"Weltposttag – 9. Oktober. Internationaler Gedenktag des Weltpostvereins. In der DDR im Zusammenhang mit dem Ehrentag der Post- und Fernmeldewerktätigen begangen.","cat":"international"},{"date":"10-13","title":"Tag der Seeverkehrswirtschaft ⚓","desc":"Tag der Seeverkehrswirtschaft – 13. Oktober. Ehrentag der Beschäftigten in der Seefahrt und Binnenschifffahrt der DDR. Bedeutsam für Rostock und die Ostseehäfen.","cat":"beruf"},{"date":"10-16","title":"Welternährungstag 🌽","desc":"Welternährungstag – 16. Oktober. Internationaler Gedenktag der FAO. In der DDR im Kontext sozialistischer Landwirtschaftspolitik und internationaler Solidarität begangen.","cat":"staat"},{"date":"10-18","title":"Tag der Leicht- und Lebensmittelindustrie 🏭","desc":"Tag der Werktätigen der Leicht-, Lebensmittel- und Nahrungsgüterindustrie – dritter Sonnabend im Oktober. Ehrentag der Beschäftigten in der Konsumgüter- und Nahrungsmittelproduktion der DDR.","cat":"beruf"},{"date":"10-24","title":"Tag der Vereinten Nationen 🌐","desc":"Tag der Vereinten Nationen – 24. Oktober. Jahrestag des Inkrafttretens der UN-Charta (1945). Die DDR trat den Vereinten Nationen 1973 bei und nutzte den Tag für Bekenntnisse zu Frieden und internationaler Zusammenarbeit.","cat":"international"},{"date":"10-07","title":"Tag der Republik 🇩🇪","desc":"Am 21. April 1950 wurde der Nationalfeiertag der Deutschen Demokratischen Republik am 7. Oktober zum bedeutendsten Staatsfeiertag der DDR erklärt. Seitdem wurde er jährlich in Berlin festlich mit einem Staatsakt und einer Militärparade begangen. In der ganzen Republik feierte das Volk mit staatlich organisierten Demonstrationen, Festveranstaltungen und Fackelzügen der FDJ den Tag der Republik. An diesem Tag wurden auch die Nationalpreise der DDR an verdiente Künstler, Wissenschaftler, Techniker und Aktivisten verliehen. Zu runden Jahrestagen gab besonders große Feierlichkeiten. Außerdem wurden alle fünf Jahre Sonderbriefmarken zum Staatsgeburtstag der DDR herausgegeben.","cat":"staat"},{"date":"11-07","title":"Jahrestag der Oktoberrevolution ☭","desc":"Jahrestag der Großen Sozialistischen Oktoberrevolution vom 7. November 1917. Wichtigster ideologischer Feiertag der DDR nach dem Tag der Republik. Kundgebungen, Feierstunden in Betrieben, Schulen und Parteiorganisationen.","cat":"staat"},{"date":"11-10","title":"Gründung des WBDJ / Weltjugendtag 🌍","desc":"Jahrestag der Gründung des Weltbundes der Demokratischen Jugend (WBDJ) am 10. November 1945 in London. Weltjugendtag – in der DDR als Zeichen internationaler Jugendbewegung und sozialistischer Solidarität begangen.","cat":"international"},{"date":"11-17","title":"Internationaler Studententag 🎓","desc":"Internationaler Studententag – 17. November. Gedenktag für die Opfer der nationalsozialistischen Repression gegen tschechische Studenten 1939. In der DDR als antifaschistischer Kampftag der Studentenbewegung begangen.","cat":"international"},{"date":"11-17","title":"Tag der Militärjustizorgane ⚖️","desc":"Tag der Militärjustizorgane der DDR – 17. November. Ehrentag der Beschäftigten in der Militärjustiz der Nationalen Volksarmee.","cat":"international"},{"date":"11-29","title":"Solidaritätstag mit dem palästinensischen Volk 🫱","desc":"Internationaler Tag der Solidarität mit dem palästinensischen Volk – 29. November. Von der UN-Generalversammlung 1977 ausgerufen. Die DDR unterhielt enge Beziehungen zur PLO und beging diesen Tag offiziell.","cat":"international"},{"date":"11-09","title":"Tag des Chemiearbeiters 🧪","desc":"Tag des Chemiearbeiters – zweiter Sonntag im November. Ehrentag der Beschäftigten in der chemischen Industrie der DDR, einem der wichtigsten Wirtschaftszweige.","cat":"beruf"},{"date":"11-16","title":"Tag des Metallurgen 🔩","desc":"Tag des Metallurgen – dritter Sonntag im November. Ehrentag der Beschäftigten in der Hüttenindustrie und Metallurgie der DDR.","cat":"beruf"},{"date":"12-01","title":"Tag der Grenztruppen der DDR 🛡️","desc":"Tag der Grenztruppen der DDR – 1. Dezember. Ehrentag der Grenzsoldaten, die die Staatsgrenze der DDR sicherten. Begangen mit Appellen und Auszeichnungen.","cat":"staat"},{"date":"12-11","title":"Tag des Gesundheitswesens 🏥","desc":"Tag des Gesundheitswesens – 11. Dezember. Ehrentag der Beschäftigten im Gesundheits- und Sozialwesen der DDR. Auszeichnungen für herausragende Leistungen in der medizinischen Versorgung.","cat":"beruf"},{"date":"12-13","title":"Pioniergeburtstag 🔴","desc":"Jahrestag der Gründung der Pionierorganisation Ernst Thälmann am 13. Dezember 1948. Massenorganisation für Kinder und Jugendliche der DDR (6–14 Jahre). Gefeiert mit Appellen, kulturellen Veranstaltungen und Aufnahmezeremonien.","cat":"person"},{"date":"12-30","title":"KPD-Gründung (1918) ✊","desc":"Jahrestag der Gründung der Kommunistischen Partei Deutschlands (KPD) am 30. Dezember 1918 in Berlin. Mitgegründet von Rosa Luxemburg und Karl Liebknecht. Ideologischer Ursprungsfeiertag der SED.","cat":"international"},{"date":"12-30","title":"Gründung der UdSSR (1922) ☭","desc":"Jahrestag der Gründung der Union der Sozialistischen Sowjetrepubliken (UdSSR) am 30. Dezember 1922. In der DDR als Jubiläum des ersten sozialistischen Staates gewürdigt. Die Sowjetunion war ein von der KPdSU zentralistisch regierter, föderativer Vielvölkerstaat, dessen Territorium sich über Osteuropa, den Kaukasus, Zentral- und über das gesamte Nordasien erstreckte. Zu den 15 Unionsrepubliken der UdSSR gehörten die Russische SFSR, die Ukrainische SSR, die Weißrussische SSR, die Usbekische SSR, die Kasachische SSR, die Georgische SSR, die Aserbaidschanische SSR, die Litauische SSR, die Moldauische SSR, die Lettische SSR, die Kirgisische SSR, die Tadschikische SSR, die Armenische SSR, die Turkmenische SSR und die Estnische SSR.","cat":"staat"},{"date":"02-11","title":"Tag der Zivilverteidigung 🪖","desc":"Tag der Zivilverteidigung der DDR – 11. Februar. Ehrentag der Zivilschutzorgane und Bevölkerungsschutzeinrichtungen. Begangen mit Übungen und Auszeichnungen.","cat":"staat"},{"date":"03-21","title":"Internationaler Tag gegen Rassendiskriminierung ✊","desc":"Internationaler Tag für die Beseitigung der Rassendiskriminierung – 21. März. Gedenkt dem Massaker von Sharpeville (1960). In der DDR als antiimperialistischer Kampftag und Zeichen der Solidarität mit den unterdrückten Völkern begangen.","cat":"international"},{"date":"03-23","title":"Welttag der Meteorologie 🌤️","desc":"Welttag der Meteorologie – 23. März. Internationaler Gedenktag der Weltorganisation für Meteorologie (WMO). In der DDR im Kontext des wissenschaftlich-technischen Fortschritts begangen.","cat":"international"},{"date":"03-27","title":"Welttheatertag 🎭","desc":"Welttheatertag – 27. März. Internationaler Gedenktag des Theaterlebens, ausgerufen vom Internationalen Theaterinstitut (ITI). In der DDR mit Aufführungen und Festveranstaltungen an Theatern begangen.","cat":"international"},{"date":"04-07","title":"Weltgesundheitstag 🏥","desc":"Weltgesundheitstag – 7. April. Jahrestag der Gründung der Weltgesundheitsorganisation (WHO, 1948). In der DDR mit Veranstaltungen zur sozialistischen Gesundheitspolitik und kostenloser Grundversorgung begangen.","cat":"international"},{"date":"04-18","title":"Internationaler Denkmaltag 🏛️","desc":"Internationaler Denkmaltag – 18. April. Tag des kulturellen Erbes, ausgerufen vom Internationalen Rat für Denkmalpflege (ICOMOS). In der DDR im Kontext der Denkmalpflege und des sozialistischen Kulturerbes begangen.","cat":"international"},{"date":"04-24","title":"Internationaler Tag der Jugend gegen Kolonialismus 🌍","desc":"Internationaler Tag der Jugend und Studenten gegen Kolonialismus und für friedliche Koexistenz – 24. April. In der DDR als antikolonialer Solidaritätstag begangen.","cat":"international"},{"date":"05-08","title":"Weltrotkreuztag 🏥 🔴","desc":"Weltrotkreuztag – 8. Mai. Geburtstag von Henri Dunant, dem Gründer des Roten Kreuzes (1828). In der DDR durch das Deutsche Rote Kreuz (DRK) mit Veranstaltungen und Spendenaktionen begangen.","cat":"international"},{"date":"05-10","title":"Tag des freien Buches 📚","desc":"Tag des freien Buches – 10. Mai. Gedenktag im Andenken an die Bücherverbrennung durch die Nationalsozialisten am 10. Mai 1933 in Deutschland. In der DDR als antifaschistischer Kulturtag begangen.","cat":"international"},{"date":"05-17","title":"Weltfernmeldetag 📡","desc":"Weltfernmeldetag – 17. Mai. Jahrestag der Gründung der Internationalen Fernmeldeunion (ITU, 1865). In der DDR im Zusammenhang mit dem Ehrentag der Post- und Fernmeldewerktätigen begangen.","cat":"international"},{"date":"05-18","title":"Internationaler Museumstag 🏛️","desc":"Internationaler Museumstag – 18. Mai. Ausgerufen vom Internationalen Museumsrat (ICOM). In der DDR mit kostenlosen Museumseintritten, Sonderführungen und kulturellen Veranstaltungen begangen.","cat":"international"},{"date":"06-05","title":"Weltumwelttag 🌿","desc":"Weltumwelttag – 5. Juni. Ausgerufen von den Vereinten Nationen seit 1972. In der DDR im Kontext des sozialistischen Umweltschutzes und der Naturpflege begangen.","cat":"international"},{"date":"10-01","title":"Weltmusiktag 🎵","desc":"Weltmusiktag – 1. Oktober. Internationaler Gedenktag der Musik, begangen in vielen sozialistischen Ländern. In der DDR mit Konzerten, Musikfestivals und kulturellen Veranstaltungen begangen.","cat":"international"},{"date":"01-03","title":"Geburtstag Wilhelm Pieck (1876) 🕯️","desc":"Wilhelm Pieck wurde am 3. Januar 1876 in Guben geboren und starb 1960 mit 84 Jahren. Er wäre heute 149 Jahre alt. Erster und einziger Staatspräsident der DDR (1949–1960), Mitgründer der KPD und der SED. Nach ihm wurden viele Straßen, Betriebe und Einrichtungen in der DDR benannt.","cat":"person"},{"date":"01-21","title":"Todestag Lenin (1924) 🕯️","desc":"Wladimir Iljitsch Lenin, geboren im Jahre 1870, verstarb am 21. Januar 1924 in Gorki Leninskie. Er wurde 53 Jahre alt. Begründer der Sowjetunion und des Marxismus-Leninismus. In der DDR mit Gedenkfeiern in Betrieben, Schulen und Parteiorganisationen begangen.","cat":"person"},{"date":"03-05","title":"Geburtstag Rosa Luxemburg (1871) 🌹","desc":"Rosa Luxemburg wurde am 5. März 1871 in Zamość (Russisches Kaiserreich, heute Polen) geboren und wurde 1919 mit 47 Jahren ermordet. Sie wäre heute 154 Jahre alt. Mitbegründerin der KPD, revolutionäre Sozialistin und Theoretikerin. Am 15. Januar 1919 ermordet. In der DDR als Märtyrerin der Arbeiterbewegung verehrt.","cat":"person"},{"date":"03-11","title":"Geburtstag Otto Grotewohl (1894) 🕯️","desc":"Otto Grotewohl wurde am 11. März 1894 in Braunschweig geboren und starb 1964 mit 70 Jahren. Er wäre heute 131 Jahre alt. Erster Ministerpräsident der DDR (1949–1964), führte die SPD in der Sowjetischen Besatzungszone in die Zwangsvereinigung mit der KPD zur SED (1946).","cat":"person"},{"date":"03-14","title":"Todestag Karl Marx (1883) 🕯️","desc":"Karl Marx, geboren im Jahre 1818, verstarb am 14. März 1883 in London. Er wurde 64 Jahre alt. Begründer des wissenschaftlichen Sozialismus gemeinsam mit Friedrich Engels. Autor des Kommunistischen Manifests (1848) und des Kapitals. Ideologisches Fundament der DDR.","cat":"person"},{"date":"04-16","title":"Geburtstag Ernst Thälmann (1886) ✊","desc":"Ernst Thälmann wurde am 16. April 1886 in Hamburg geboren und wurde 1944 mit 57 Jahren ermordet. Er wäre heute 139 Jahre alt. Vorsitzender der KPD (1925–1933), inhaftiert von den Nationalsozialisten 1933, am 18. August 1944 im KZ Buchenwald ermordet. Zentrales Heldenbild der DDR – nach ihm wurde die Pionierorganisation benannt.","cat":"person"},{"date":"05-05","title":"Geburtstag Karl Marx (1818) 🕯️","desc":"Karl Marx wurde am 5. Mai 1818 in Trier geboren und starb 1883 mit 64 Jahren. Er wäre heute 207 Jahre alt. Philosoph, Ökonom und revolutionärer Theoretiker. Seine Schriften bildeten die ideologische Grundlage des Marxismus-Leninismus und damit der gesamten DDR-Staatsideologie.","cat":"person"},{"date":"06-30","title":"Geburtstag Walter Ulbricht (1893) 🕯️","desc":"Walter Ulbricht wurde am 30. Juni 1893 in Leipzig geboren und starb 1973 mit 80 Jahren. Er wäre heute 132 Jahre alt. Erster Sekretär der SED (1950–1971) und Vorsitzender des Staatsrats (1960–1973). Maßgeblich für den Aufbau der DDR verantwortlich, ordnete den Mauerbau 1961 an. Gestorben am 1. August 1973.","cat":"person"},{"date":"08-05","title":"Todestag Friedrich Engels (1895) 🕯️","desc":"Friedrich Engels, geboren im Jahre 1820, verstarb am 5. August 1895 in London. Er wurde 74 Jahre alt. Mitbegründer des wissenschaftlichen Sozialismus gemeinsam mit Karl Marx. Finanzierte Marx' Arbeit und vollendete das Kapital nach dessen Tod. Ideologisches Fundament der DDR.","cat":"person"},{"date":"08-13","title":"Geburtstag Karl Liebknecht (1871) 🕯️","desc":"Karl Liebknecht wurde am 13. August 1871 in Leipzig geboren und wurde 1919 mit 47 Jahren ermordet. Er wäre heute 154 Jahre alt. Mitbegründer der KPD, erklärte am 9. November 1918 die Freie Sozialistische Republik Deutschland. Am 15. Januar 1919 gemeinsam mit Rosa Luxemburg ermordet.","cat":"person"},{"date":"08-13","title":"Jahrestag des Mauerbaus (1961) 🧱","desc":"Jahrestag der Sicherung der Staatsgrenze der DDR am 13. August 1961 – in der DDR offiziell als notwendige Schutzmaßnahme gegen den 'Imperialismus' bezeichnet. Beginn des Baus der Berliner Mauer. In der DDR als Stabilisierung des sozialistischen Staates propagiert.","cat":"staat"},{"date":"08-18","title":"Ermordung Ernst Thälmanns (1944) 🕯️","desc":"Ernst Thälmann, geboren im Jahre 1886, wurde am 18. August 1944 im KZ Buchenwald ermordet. Er wurde 57 Jahre alt. Auf Befehl Hitlers erschossen. Zentrales Märtyrerdatum der DDR-Gedenkkultur. Mit Gedenkfeiern, Kranzniederlegungen und Appellen der Pionierorganisation begangen.","cat":"person"},{"date":"11-28","title":"Geburtstag Friedrich Engels (1820) 🕯️","desc":"Friedrich Engels wurde am 28. November 1820 in Barmen (heute Wuppertal) geboren und starb 1895 mit 74 Jahren. Er wäre heute 205 Jahre alt. Mitbegründer des Marxismus, enger Weggefährte von Karl Marx. Ideologisches Fundament der DDR-Staatsideologie.","cat":"person"},{"date":"09-07","title":"Todestag Wilhelm Pieck (1960) 🕯️","desc":"Wilhelm Pieck, geboren im Jahre 1876, verstarb am 7. September 1960 in Moskau. Er wurde 84 Jahre alt. Erster und einziger Staatspräsident der DDR (1949–1960), Mitgründer der KPD und der SED. Nach seinem Tod wurde das Amt des Staatspräsidenten abgeschafft und durch den Staatsrat ersetzt.","cat":"person"},{"date":"09-21","title":"Todestag Otto Grotewohl (1964) 🕯️","desc":"Otto Grotewohl, geboren im Jahre 1894, verstarb am 21. September 1964 in Ost-Berlin. Er wurde 70 Jahre alt. Erster Ministerpräsident der DDR (1949–1964), führte die SPD in der Sowjetischen Besatzungszone in die Zwangsvereinigung mit der KPD zur SED (1946).","cat":"person"},{"date":"08-01","title":"Todestag Walter Ulbricht (1973) 🕯️","desc":"Walter Ulbricht, geboren im Jahre 1893, verstarb am 1. August 1973 am Döllnsee in Brandenburg. Er wurde 80 Jahre alt. Erster Sekretär der SED (1950–1971) und Vorsitzender des Staatsrats (1960–1973). Maßgeblich für den Aufbau der DDR verantwortlich, ordnete den Mauerbau 1961 an.","cat":"person"},{"date":"08-25","title":"Geburtstag Erich Honecker (1912) 🕯️","desc":"Erich Honecker wurde am 25. August 1912 in Neunkirchen (Saar) geboren und starb 1994 mit 81 Jahren. Er wäre heute 113 Jahre alt. Generalsekretär der SED und Vorsitzender des Staatsrats (1971–1989), prägte die DDR in ihrer Spätphase. Verantwortlich für den Schießbefehl an der Grenze. Floh 1991 nach Chile, wo er 1994 verstarb.","cat":"person"},{"date":"05-29","title":"Todestag Erich Honecker (1994) 🕯️","desc":"Erich Honecker, geboren im Jahre 1912, verstarb am 29. Mai 1994 in Santiago de Chile. Er wurde 81 Jahre alt. Generalsekretär der SED und Vorsitzender des Staatsrats der DDR (1971–1989). Nach dem Mauerfall angeklagt, floh er 1991 in die chilenische Botschaft in Moskau und später nach Chile, wo er an Leberkrebs starb.","cat":"person"},{"date":"04-17","title":"Geburtstag Margot Honecker (1927) 🕯️","desc":"Margot Honecker wurde am 17. April 1927 in Halle (Saale) geboren und starb 2016 mit 89 Jahren. Sie wäre heute 98 Jahre alt. Ministerin für Volksbildung der DDR (1963–1989), eine der mächtigsten Frauen des Staates. Ehefrau von Erich Honecker. Verantwortlich für das sozialistische Bildungssystem der DDR. Floh nach dem Mauerfall nach Chile, wo sie 2016 verstarb.","cat":"person"},{"date":"05-06","title":"Todestag Margot Honecker (2016) 🕯️","desc":"Margot Honecker, geboren im Jahre 1927, verstarb am 6. Mai 2016 in Santiago de Chile. Sie wurde 89 Jahre alt. Ministerin für Volksbildung der DDR (1963–1989), prägte das sozialistische Schul- und Erziehungswesen. Nach dem Mauerfall floh sie gemeinsam mit Erich Honecker nach Chile, wo sie bis zu ihrem Tod lebte.","cat":"person"},{"date":"03-19","title":"Geburtstag Egon Krenz (1937) 🕯️","desc":"Egon Krenz wurde am 19. März 1937 in Kołobrzeg (damals Kolberg, heute Polen) geboren. Er ist heute 88 Jahre alt. Letzter Generalsekretär der SED und Vorsitzender des Staatsrats der DDR (Oktober–Dezember 1989). Langjähriger FDJ-Vorsitzender (1974–1983), galt als designierter Nachfolger Honeckers. Öffnete am 9. November 1989 die Berliner Mauer. 1997 wegen Totschlags an Mauerflüchtlingen verurteilt.","cat":"person"},{"date":"12-28","title":"Geburtstag Erich Mielke (1907) 🕯️","desc":"Erich Mielke wurde am 28. Dezember 1907 in Berlin geboren und starb 2000 mit 92 Jahren. Er wäre heute 118 Jahre alt. Minister für Staatssicherheit der DDR (1957–1989), Chef der Stasi. Baute den DDR-Geheimdienst zu einem der effektivsten Überwachungsapparate der Welt aus. 1993 wegen Mordes an zwei Polizisten im Jahr 1931 verurteilt.","cat":"person"},{"date":"05-21","title":"Todestag Erich Mielke (2000) 🕯️","desc":"Erich Mielke, geboren im Jahre 1907, verstarb am 21. Mai 2000 in Berlin. Er wurde 92 Jahre alt. Minister für Staatssicherheit der DDR (1957–1989). Unter seiner Führung beschäftigte die Stasi über 90.000 hauptamtliche Mitarbeiter und rund 170.000 inoffizielle Informanten. Nach der Wende wegen Mordes verurteilt, wegen Verhandlungsunfähigkeit jedoch vorzeitig entlassen.","cat":"person"},{"date":"01-15","title":"Ermordung Rosa Luxemburg (1919) 🌹","desc":"Rosa Luxemburg, geboren im Jahre 1871, wurde am 15. Januar 1919 in Berlin ermordet. Sie wurde 47 Jahre alt. Mitbegründerin der KPD, revolutionäre Sozialistin und Theoretikerin. Nach dem Spartakusaufstand von Freikorpssoldaten verhaftet, misshandelt und erschossen. Ihre Leiche wurde in den Landwehrkanal geworfen. In der DDR als Märtyrerin der Arbeiterbewegung verehrt.","cat":"person"},{"date":"01-15","title":"Ermordung Karl Liebknecht (1919) 🕯️","desc":"Karl Liebknecht, geboren im Jahre 1871, wurde am 15. Januar 1919 in Berlin ermordet. Er wurde 47 Jahre alt. Mitbegründer der KPD, erklärte am 9. November 1918 die Freie Sozialistische Republik Deutschland. Nach dem Spartakusaufstand von Freikorpssoldaten verhaftet, misshandelt und erschossen. In der DDR als Märtyrer der Arbeiterbewegung verehrt.","cat":"person"},{"date":"03-17","title":"Weltschifffahrtstag 🚢","desc":"Weltschifffahrtstag – 17. März. Internationaler Gedenktag der Schifffahrt, ausgerufen von der Internationalen Seeschifffahrts-Organisation (IMO). In der DDR im Kontext der Seeverkehrswirtschaft und des Rostocker Hafens begangen.","cat":"international"},{"date":"04-12","title":"Tag der Luft- und Raumfahrt 🚀","desc":"Tag der Luft- und Raumfahrt – 12. April. Jahrestag des ersten bemannten Weltraumflugs durch Juri Gagarin am 12. April 1961. In der DDR mit Veranstaltungen in Schulen, Betrieben und Planetarien begangen. Besonders bedeutsam nach dem gemeinsamen Weltraumflug von Sigmund Jähn am 26. August 1978, dem ersten Deutschen im Weltall.","cat":"beruf"},{"date":"04-12","title":"Tag der Jungen Techniker und Naturforscher 🔬","desc":"Tag der Jungen Techniker und Naturforscher – 12. April. Ehrentag der Kinder und Jugendlichen, die sich in den Arbeitsgemeinschaften für Technik, Naturwissenschaft und Astronomie engagierten. Organisiert durch die Pionierorganisation Ernst Thälmann und die Gesellschaft für Sport und Technik (GST). Begleitet von Ausstellungen, Wettbewerben und Vorführungen.","cat":"beruf"},{"date":"04-23","title":"Welttag des Buches 📖","desc":"Welttag des Buches – 23. April. Internationaler Gedenktag für Literatur und das Lesen. In der DDR im Kontext der sozialistischen Bildungspolitik und des staatlichen Verlagswesens begangen. Die DDR hatte eine der höchsten Lesequoten der Welt.","cat":"international"},{"date":"04-27","title":"Welttag der Partnerstädte 🤝","desc":"Welttag der Partnerstädte – letzter Sonntag im April. Internationaler Gedenktag der Städtepartnerschaften, ausgerufen vom Weltverband der Partnerstädte (WFUCA). In der DDR wurden Partnerschaften vor allem mit sozialistischen Städten in der UdSSR, Polen, der Tschechoslowakei und anderen Bruderstaaten gepflegt.","cat":"international"},{"date":"06-16","title":"Tag der Solidarität mit Südafrika ✊","desc":"Tag der Solidarität mit dem Kampf des Volkes von Südafrika – 16. Juni. Gedenktag im Andenken an den Soweto-Aufstand vom 16. Juni 1976, bei dem südafrikanische Schüler gegen die Apartheidpolitik protestierten und von der Polizei erschossen wurden. In der DDR als antiimperialistischer Solidaritätstag begangen.","cat":"international"}],"2026":[{"date":"01-12","title":"Liebknecht & Luxemburg Gedenktag 🌹","desc":"Gedenktag für Karl Liebknecht und Rosa Luxemburg – am Sonntag, der dem 15. Januar am nächsten liegt. Beide wurden am 15. Januar 1919 ermordet. Jährliche Gedenkdemonstration in Berlin.","cat":"staat"},{"date":"02-08","title":"Tag der Werktätigen des
