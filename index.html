iterregierung in der Geschichte. In der DDR als revolutionäres Vorbild gewürdigt.","cat":"staat"},{"date":"04-11","title":"Befreiung KZ Buchenwald 🕯️","desc":"Gedenktag zur Befreiung des Konzentrationslagers Buchenwald am 11. April 1945 durch US-amerikanische Truppen. Einer der zentralen Gedenkfeiern in der DDR – Buchenwald als nationales Mahnmal gepflegt.","cat":"staat"},{"date":"04-09","title":"Tag des Metallarbeiters ⚙️","desc":"Ehrentag der Metallarbeiterinnen und Metallarbeiter der DDR – zweiter Sonntag im April. Gefeiert in Betrieben der metallerzeugenden und metallverarbeitenden Industrie.","cat":"beruf"},{"date":"04-21","title":"Gründungstag der SED 🔴","desc":"Jahrestag der Gründung der Sozialistischen Einheitspartei Deutschlands (SED) am 21./22. April 1946 durch Zwangsvereinigung von SPD und KPD in der Sowjetischen Besatzungszone.","cat":"staat"},{"date":"04-22","title":"Geburtstag Lenin ☭","desc":"Wladimir Iljitsch Lenin wurde am 22. April 1870 in Simbirsk (heute Uljanowsk) geboren und starb 1924 mit 53 Jahren. Er wäre heute 164 Jahre alt. Begründer der Sowjetunion und theoretischer Vordenker des Marxismus-Leninismus. Gedenktag in Betrieben, Schulen und Parteiorganisationen.","cat":"person"},{"date":"05-01","title":"Tag der Arbeit ✊","desc":"Internationaler Kampf- und Feiertag der Werktätigen – 1. Mai. Größter politischer Feiertag im Frühling. Massenaufmärsche, Kundgebungen und Militärparaden in allen Städten der DDR.","cat":"staat"},{"date":"05-08","title":"Jahrestag der Befreiung 🕊️","desc":"Jahrestag der Befreiung vom Hitlerfaschismus am 8. Mai 1945 – Tag der bedingungslosen Kapitulation der Wehrmacht. In der DDR als 'Tag der Befreiung' begangen, nicht als Niederlage, sondern als Befreiung durch die Sowjetunion.","cat":"staat"},{"date":"05-09","title":"Tag des Sieges 🎖️","desc":"Tag des Sieges der Völker der UdSSR über den Hitlerfaschismus – 9. Mai 1945 (sowjetischer Kalender). In der DDR parallel zum 8. Mai als Ausdruck der engen Verbundenheit mit der Sowjetunion begangen.","cat":"staat"},{"date":"06-01","title":"Internationaler Kindertag 🎈","desc":"Internationaler Kindertag – 1. Juni. Einer der beliebtesten Feiertage in der DDR. Kinder erhielten Geschenke, Schulen und Betriebe organisierten Feste und Ausflüge.","cat":"international"},{"date":"06-12","title":"Tag des Lehrers 📚","desc":"Tag des Lehrers – 12. Juni. Ehrentag für Lehrerinnen und Lehrer in der DDR. Schülerinnen und Schüler überreichten Blumen und Geschenke, Schulen veranstalteten Feierstunden.","cat":"beruf"},{"date":"06-11","title":"Tag des Eisenbahners 🚂","desc":"Tag des Eisenbahners und der Werktätigen des Verkehrswesens – zweiter Sonntag im Juni. Ehrentag der Beschäftigten der Deutschen Reichsbahn und des gesamten Verkehrswesens.","cat":"beruf"},{"date":"05-27","title":"Tag der Jugendbrigaden 👷","desc":"Tag der Jugendbrigaden – Freitag vor Pfingsten (ab 1978). Ehrentag der sozialistischen Jugendbrigaden in Betrieben und Kombinaten der DDR. Auszeichnungen für herausragende Arbeitsleistungen junger Werktätiger.","cat":"staat"},{"date":"06-17","title":"Tag der Werktätigen der Wasserwirtschaft 💧","desc":"Tag der Werktätigen der Wasserwirtschaft – dritter Sonnabend im Juni. Ehrentag der Beschäftigten in Wasserversorgung, Abwasserwirtschaft und Gewässerschutz der DDR.","cat":"beruf"},{"date":"06-22","title":"Gedenktag: Überfall auf die Sowjetunion 🕯️","desc":"Jahrestag des deutschen Überfalls auf die Sowjetunion am 22. Juni 1941 – Beginn des 'Großen Vaterländischen Krieges'. In der DDR als Mahntag gegen Krieg und Faschismus begangen.","cat":"international"},{"date":"06-18","title":"Tag der Genossenschaftsbauern 🌾","desc":"Tag der Genossenschaftsbauern und Arbeiter der sozialistischen Land- und Forstwirtschaft – dritter Sonntag im Juni. Ehrentag der Beschäftigten in den Landwirtschaftlichen Produktionsgenossenschaften (LPG).","cat":"beruf"},{"date":"06-25","title":"Tag des Bauarbeiters 🏗️","desc":"Tag des Bauarbeiters – vierter Sonntag im Juni. Ehrentag der Beschäftigten im Bauwesen der DDR. Mit Betriebsfeiern und Auszeichnungen begangen.","cat":"beruf"},{"date":"07-01","title":"Tag der Deutschen Volkspolizei 🚔","desc":"Tag der Deutschen Volkspolizei – 1. Juli. Ehrentag der Volkspolizei der DDR. Begangen mit Appellen, Auszeichnungen und öffentlichen Veranstaltungen.","cat":"international"},{"date":"07-02","title":"Tag des Bergmanns und Energiearbeiters ⛏️","desc":"Tag des Bergmanns und des Energiearbeiters – erster Sonntag im Juli. Ehrentag der Beschäftigten im Bergbau und in der Energiewirtschaft. Besonders bedeutsam in den Braunkohlerevieren der DDR.","cat":"beruf"},{"date":"07-18","title":"Tag der Internationalen Brigaden 🌍","desc":"Tag der Internationalen Brigaden – 18. Juli. Gedenktag für die internationalen Freiwilligen, die im Spanischen Bürgerkrieg (1936–1939) gegen den Faschismus kämpften. In der DDR als antifaschistisches Symbol gewürdigt.","cat":"international"},{"date":"08-02","title":"Potsdamer Abkommen (1945) 📜","desc":"Jahrestag der Unterzeichnung des Potsdamer Abkommens am 2. August 1945 durch UdSSR, USA und Großbritannien. Regelte die Nachkriegsordnung Deutschlands. In der DDR als Grundlage der Nachkriegspolitik gewürdigt.","cat":"staat"},{"date":"08-07","title":"Gründung der GST (1952) 🚀","desc":"Jahrestag der Gründung der Gesellschaft für Sport und Technik (GST) am 7. August 1952. Paramilitärische Massenorganisation der DDR zur vormilitärischen Ausbildung von Jugendlichen.","cat":"staat"},{"date":"09-01","title":"Weltfriedenstag ☮️","desc":"Weltfriedenstag – 1. September. Jahrestag des Beginns des Zweiten Weltkriegs (1939). In der DDR als internationaler Antikriegstag und Friedensappell begangen.","cat":"international"},{"date":"09-08","title":"Weltalphabetisierungstag 📖","desc":"Weltalphabetisierungstag – 8. September. Internationaler Gedenktag für Bildung und Bekämpfung des Analphabetismus. In der DDR im Kontext der sozialistischen Bildungspolitik begangen.","cat":"staat"},{"date":"09-16","title":"Tag der haus- und kommunalwirtschaftlichen Dienstleistungen 🏘️","desc":"Tag der Werktätigen des Bereiches der haus- und kommunalwirtschaftlichen Dienstleistungen – dritter Sonnabend im September. Ehrentag der Beschäftigten in Hauswirtschaft, Wohnungswirtschaft und kommunalen Diensten.","cat":"beruf"},{"date":"09-10","title":"OdF-Tag – Gedenktag Opfer des Faschismus 🕯️","desc":"Internationaler Gedenktag für die Opfer des faschistischen Terrors und Kampftag gegen Faschismus und imperialistischen Krieg – zweiter Sonntag im September. Einer der bedeutendsten Gedenktage der DDR. Kranzniederlegungen, Gedenkfeiern an Mahnmalen.","cat":"international"},{"date":"10-09","title":"Weltposttag 📬","desc":"Weltposttag – 9. Oktober. Internationaler Gedenktag des Weltpostvereins. In der DDR im Zusammenhang mit dem Ehrentag der Post- und Fernmeldewerktätigen begangen.","cat":"international"},{"date":"10-13","title":"Tag der Seeverkehrswirtschaft ⚓","desc":"Tag der Seeverkehrswirtschaft – 13. Oktober. Ehrentag der Beschäftigten in der Seefahrt und Binnenschifffahrt der DDR. Bedeutsam für Rostock und die Ostseehäfen.","cat":"beruf"},{"date":"10-16","title":"Welternährungstag 🌽","desc":"Welternährungstag – 16. Oktober. Internationaler Gedenktag der FAO. In der DDR im Kontext sozialistischer Landwirtschaftspolitik und internationaler Solidarität begangen.","cat":"staat"},{"date":"10-21","title":"Tag der Leicht- und Lebensmittelindustrie 🏭","desc":"Tag der Werktätigen der Leicht-, Lebensmittel- und Nahrungsgüterindustrie – dritter Sonnabend im Oktober. Ehrentag der Beschäftigten in der Konsumgüter- und Nahrungsmittelproduktion der DDR.","cat":"beruf"},{"date":"10-24","title":"Tag der Vereinten Nationen 🌐","desc":"Tag der Vereinten Nationen – 24. Oktober. Jahrestag des Inkrafttretens der UN-Charta (1945). Die DDR trat den Vereinten Nationen 1973 bei und nutzte den Tag für Bekenntnisse zu Frieden und internationaler Zusammenarbeit.","cat":"international"},{"date":"10-07","title":"Tag der Republik 🇩🇪","desc":"Am 21. April 1950 wurde der Nationalfeiertag der Deutschen Demokratischen Republik am 7. Oktober zum bedeutendsten Staatsfeiertag der DDR erklärt. Seitdem wurde er jährlich in Berlin festlich mit einem Staatsakt und einer Militärparade begangen. In der ganzen Republik feierte das Volk mit staatlich organisierten Demonstrationen, Festveranstaltungen und Fackelzügen der FDJ den Tag der Republik. An diesem Tag wurden auch die Nationalpreise der DDR an verdiente Künstler, Wissenschaftler, Techniker und Aktivisten verliehen. Zu runden Jahrestagen gab besonders große Feierlichkeiten. Außerdem wurden alle fünf Jahre Sonderbriefmarken zum Staatsgeburtstag der DDR herausgegeben.","cat":"staat"},{"date":"11-07","title":"Jahrestag der Oktoberrevolution ☭","desc":"Jahrestag der Großen Sozialistischen Oktoberrevolution vom 7. November 1917. Wichtigster ideologischer Feiertag der DDR nach dem Tag der Republik. Kundgebungen, Feierstunden in Betrieben, Schulen und Parteiorganisationen.","cat":"staat"},{"date":"11-10","title":"Gründung des WBDJ / Weltjugendtag 🌍","desc":"Jahrestag der Gründung des Weltbundes der Demokratischen Jugend (WBDJ) am 10. November 1945 in London. Weltjugendtag – in der DDR als Zeichen internationaler Jugendbewegung und sozialistischer Solidarität begangen.","cat":"international"},{"date":"11-17","title":"Internationaler Studententag 🎓","desc":"Internationaler Studententag – 17. November. Gedenktag für die Opfer der nationalsozialistischen Repression gegen tschechische Studenten 1939. In der DDR als antifaschistischer Kampftag der Studentenbewegung begangen.","cat":"international"},{"date":"11-17","title":"Tag der Militärjustizorgane ⚖️","desc":"Tag der Militärjustizorgane der DDR – 17. November. Ehrentag der Beschäftigten in der Militärjustiz der Nationalen Volksarmee.","cat":"international"},{"date":"11-29","title":"Solidaritätstag mit dem palästinensischen Volk 🫱","desc":"Internationaler Tag der Solidarität mit dem palästinensischen Volk – 29. November. Von der UN-Generalversammlung 1977 ausgerufen. Die DDR unterhielt enge Beziehungen zur PLO und beging diesen Tag offiziell.","cat":"international"},{"date":"11-12","title":"Tag des Chemiearbeiters 🧪","desc":"Tag des Chemiearbeiters – zweiter Sonntag im November. Ehrentag der Beschäftigten in der chemischen Industrie der DDR, einem der wichtigsten Wirtschaftszweige.","cat":"beruf"},{"date":"11-19","title":"Tag des Metallurgen 🔩","desc":"Tag des Metallurgen – dritter Sonntag im November. Ehrentag der Beschäftigten in der Hüttenindustrie und Metallurgie der DDR.","cat":"beruf"},{"date":"12-01","title":"Tag der Grenztruppen der DDR 🛡️","desc":"Tag der Grenztruppen der DDR – 1. Dezember. Ehrentag der Grenzsoldaten, die die Staatsgrenze der DDR sicherten. Begangen mit Appellen und Auszeichnungen.","cat":"staat"},{"date":"12-11","title":"Tag des Gesundheitswesens 🏥","desc":"Tag des Gesundheitswesens – 11. Dezember. Ehrentag der Beschäftigten im Gesundheits- und Sozialwesen der DDR. Auszeichnungen für herausragende Leistungen in der medizinischen Versorgung.","cat":"beruf"},{"date":"12-13","title":"Pioniergeburtstag 🔴","desc":"Jahrestag der Gründung der Pionierorganisation Ernst Thälmann am 13. Dezember 1948. Massenorganisation für Kinder und Jugendliche der DDR (6–14 Jahre). Gefeiert mit Appellen, kulturellen Veranstaltungen und Aufnahmezeremonien.","cat":"person"},{"date":"12-30","title":"KPD-Gründung (1918) ✊","desc":"Jahrestag der Gründung der Kommunistischen Partei Deutschlands (KPD) am 30. Dezember 1918 in Berlin. Mitgegründet von Rosa Luxemburg und Karl Liebknecht. Ideologischer Ursprungsfeiertag der SED.","cat":"international"},{"date":"12-30","title":"Gründung der UdSSR (1922) ☭","desc":"Jahrestag der Gründung der Union der Sozialistischen Sowjetrepubliken (UdSSR) am 30. Dezember 1922. In der DDR als Jubiläum des ersten sozialistischen Staates gewürdigt. Die Sowjetunion war ein von der KPdSU zentralistisch regierter, föderativer Vielvölkerstaat, dessen Territorium sich über Osteuropa, den Kaukasus, Zentral- und über das gesamte Nordasien erstreckte. Zu den 15 Unionsrepubliken der UdSSR gehörten die Russische SFSR, die Ukrainische SSR, die Weißrussische SSR, die Usbekische SSR, die Kasachische SSR, die Georgische SSR, die Aserbaidschanische SSR, die Litauische SSR, die Moldauische SSR, die Lettische SSR, die Kirgisische SSR, die Tadschikische SSR, die Armenische SSR, die Turkmenische SSR und die Estnische SSR.","cat":"staat"},{"date":"02-11","title":"Tag der Zivilverteidigung 🪖","desc":"Tag der Zivilverteidigung der DDR – 11. Februar. Ehrentag der Zivilschutzorgane und Bevölkerungsschutzeinrichtungen. Begangen mit Übungen und Auszeichnungen.","cat":"staat"},{"date":"03-21","title":"Internationaler Tag gegen Rassendiskriminierung ✊","desc":"Internationaler Tag für die Beseitigung der Rassendiskriminierung – 21. März. Gedenkt dem Massaker von Sharpeville (1960). In der DDR als antiimperialistischer Kampftag und Zeichen der Solidarität mit den unterdrückten Völkern begangen.","cat":"international"},{"date":"03-23","title":"Welttag der Meteorologie 🌤️","desc":"Welttag der Meteorologie – 23. März. Internationaler Gedenktag der Weltorganisation für Meteorologie (WMO). In der DDR im Kontext des wissenschaftlich-technischen Fortschritts begangen.","cat":"international"},{"date":"03-27","title":"Welttheatertag 🎭","desc":"Welttheatertag – 27. März. Internationaler Gedenktag des Theaterlebens, ausgerufen vom Internationalen Theaterinstitut (ITI). In der DDR mit Aufführungen und Festveranstaltungen an Theatern begangen.","cat":"international"},{"date":"04-07","title":"Weltgesundheitstag 🏥","desc":"Weltgesundheitstag – 7. April. Jahrestag der Gründung der Weltgesundheitsorganisation (WHO, 1948). In der DDR mit Veranstaltungen zur sozialistischen Gesundheitspolitik und kostenloser Grundversorgung begangen.","cat":"international"},{"date":"04-18","title":"Internationaler Denkmaltag 🏛️","desc":"Internationaler Denkmaltag – 18. April. Tag des kulturellen Erbes, ausgerufen vom Internationalen Rat für Denkmalpflege (ICOMOS). In der DDR im Kontext der Denkmalpflege und des sozialistischen Kulturerbes begangen.","cat":"international"},{"date":"04-24","title":"Internationaler Tag der Jugend gegen Kolonialismus 🌍","desc":"Internationaler Tag der Jugend und Studenten gegen Kolonialismus und für friedliche Koexistenz – 24. April. In der DDR als antikolonialer Solidaritätstag begangen.","cat":"international"},{"date":"05-08","title":"Weltrotkreuztag 🏥 🔴","desc":"Weltrotkreuztag – 8. Mai. Geburtstag von Henri Dunant, dem Gründer des Roten Kreuzes (1828). In der DDR durch das Deutsche Rote Kreuz (DRK) mit Veranstaltungen und Spendenaktionen begangen.","cat":"international"},{"date":"05-10","title":"Tag des freien Buches 📚","desc":"Tag des freien Buches – 10. Mai. Gedenktag im Andenken an die Bücherverbrennung durch die Nationalsozialisten am 10. Mai 1933 in Deutschland. In der DDR als antifaschistischer Kulturtag begangen.","cat":"international"},{"date":"05-17","title":"Weltfernmeldetag 📡","desc":"Weltfernmeldetag – 17. Mai. Jahrestag der Gründung der Internationalen Fernmeldeunion (ITU, 1865). In der DDR im Zusammenhang mit dem Ehrentag der Post- und Fernmeldewerktätigen begangen.","cat":"international"},{"date":"05-18","title":"Internationaler Museumstag 🏛️","desc":"Internationaler Museumstag – 18. Mai. Ausgerufen vom Internationalen Museumsrat (ICOM). In der DDR mit kostenlosen Museumseintritten, Sonderführungen und kulturellen Veranstaltungen begangen.","cat":"international"},{"date":"06-05","title":"Weltumwelttag 🌿","desc":"Weltumwelttag – 5. Juni. Ausgerufen von den Vereinten Nationen seit 1972. In der DDR im Kontext des sozialistischen Umweltschutzes und der Naturpflege begangen.","cat":"international"},{"date":"10-01","title":"Weltmusiktag 🎵","desc":"Weltmusiktag – 1. Oktober. Internationaler Gedenktag der Musik, begangen in vielen sozialistischen Ländern. In der DDR mit Konzerten, Musikfestivals und kulturellen Veranstaltungen begangen.","cat":"international"},{"date":"01-03","title":"Geburtstag Wilhelm Pieck (1876) 🕯️","desc":"Wilhelm Pieck wurde am 3. Januar 1876 in Guben geboren und starb 1960 mit 84 Jahren. Er wäre heute 158 Jahre alt. Erster und einziger Staatspräsident der DDR (1949–1960), Mitgründer der KPD und der SED. Nach ihm wurden viele Straßen, Betriebe und Einrichtungen in der DDR benannt.","cat":"person"},{"date":"01-21","title":"Todestag Lenin (1924) 🕯️","desc":"Wladimir Iljitsch Lenin, geboren im Jahre 1870, verstarb am 21. Januar 1924 in Gorki Leninskie. Er wurde 53 Jahre alt. Begründer der Sowjetunion und des Marxismus-Leninismus. In der DDR mit Gedenkfeiern in Betrieben, Schulen und Parteiorganisationen begangen.","cat":"person"},{"date":"03-05","title":"Geburtstag Rosa Luxemburg (1871) 🌹","desc":"Rosa Luxemburg wurde am 5. März 1871 in Zamość (Russisches Kaiserreich, heute Polen) geboren und wurde 1919 mit 47 Jahren ermordet. Sie wäre heute 163 Jahre alt. Mitbegründerin der KPD, revolutionäre Sozialistin und Theoretikerin. Am 15. Januar 1919 ermordet. In der DDR als Märtyrerin der Arbeiterbewegung verehrt.","cat":"person"},{"date":"03-11","title":"Geburtstag Otto Grotewohl (1894) 🕯️","desc":"Otto Grotewohl wurde am 11. März 1894 in Braunschweig geboren und starb 1964 mit 70 Jahren. Er wäre heute 140 Jahre alt. Erster Ministerpräsident der DDR (1949–1964), führte die SPD in der Sowjetischen Besatzungszone in die Zwangsvereinigung mit der KPD zur SED (1946).","cat":"person"},{"date":"03-14","title":"Todestag Karl Marx (1883) 🕯️","desc":"Karl Marx, geboren im Jahre 1818, verstarb am 14. März 1883 in London. Er wurde 64 Jahre alt. Begründer des wissenschaftlichen Sozialismus gemeinsam mit Friedrich Engels. Autor des Kommunistischen Manifests (1848) und des Kapitals. Ideologisches Fundament der DDR.","cat":"person"},{"date":"04-16","title":"Geburtstag Ernst Thälmann (1886) ✊","desc":"Ernst Thälmann wurde am 16. April 1886 in Hamburg geboren und wurde 1944 mit 57 Jahren ermordet. Er wäre heute 148 Jahre alt. Vorsitzender der KPD (1925–1933), inhaftiert von den Nationalsozialisten 1933, am 18. August 1944 im KZ Buchenwald ermordet. Zentrales Heldenbild der DDR – nach ihm wurde die Pionierorganisation benannt.","cat":"person"},{"date":"05-05","title":"Geburtstag Karl Marx (1818) 🕯️","desc":"Karl Marx wurde am 5. Mai 1818 in Trier geboren und starb 1883 mit 64 Jahren. Er wäre heute 216 Jahre alt. Philosoph, Ökonom und revolutionärer Theoretiker. Seine Schriften bildeten die ideologische Grundlage des Marxismus-Leninismus und damit der gesamten DDR-Staatsideologie.","cat":"person"},{"date":"06-30","title":"Geburtstag Walter Ulbricht (1893) 🕯️","desc":"Walter Ulbricht wurde am 30. Juni 1893 in Leipzig geboren und starb 1973 mit 80 Jahren. Er wäre heute 141 Jahre alt. Erster Sekretär der SED (1950–1971) und Vorsitzender des Staatsrats (1960–1973). Maßgeblich für den Aufbau der DDR verantwortlich, ordnete den Mauerbau 1961 an. Gestorben am 1. August 1973.","cat":"person"},{"date":"08-05","title":"Todestag Friedrich Engels (1895) 🕯️","desc":"Friedrich Engels, geboren im Jahre 1820, verstarb am 5. August 1895 in London. Er wurde 74 Jahre alt. Mitbegründer des wissenschaftlichen Sozialismus gemeinsam mit Karl Marx. Finanzierte Marx' Arbeit und vollendete das Kapital nach dessen Tod. Ideologisches Fundament der DDR.","cat":"person"},{"date":"08-13","title":"Geburtstag Karl Liebknecht (1871) 🕯️","desc":"Karl Liebknecht wurde am 13. August 1871 in Leipzig geboren und wurde 1919 mit 47 Jahren ermordet. Er wäre heute 163 Jahre alt. Mitbegründer der KPD, erklärte am 9. November 1918 die Freie Sozialistische Republik Deutschland. Am 15. Januar 1919 gemeinsam mit Rosa Luxemburg ermordet.","cat":"person"},{"date":"08-13","title":"Jahrestag des Mauerbaus (1961) 🧱","desc":"Jahrestag der Sicherung der Staatsgrenze der DDR am 13. August 1961 – in der DDR offiziell als notwendige Schutzmaßnahme gegen den 'Imperialismus' bezeichnet. Beginn des Baus der Berliner Mauer. In der DDR als Stabilisierung des sozialistischen Staates propagiert.","cat":"staat"},{"date":"08-18","title":"Ermordung Ernst Thälmanns (1944) 🕯️","desc":"Ernst Thälmann, geboren im Jahre 1886, wurde am 18. August 1944 im KZ Buchenwald ermordet. Er wurde 57 Jahre alt. Auf Befehl Hitlers erschossen. Zentrales Märtyrerdatum der DDR-Gedenkkultur. Mit Gedenkfeiern, Kranzniederlegungen und Appellen der Pionierorganisation begangen.","cat":"person"},{"date":"11-28","title":"Geburtstag Friedrich Engels (1820) 🕯️","desc":"Friedrich Engels wurde am 28. November 1820 in Barmen (heute Wuppertal) geboren und starb 1895 mit 74 Jahren. Er wäre heute 214 Jahre alt. Mitbegründer des Marxismus, enger Weggefährte von Karl Marx. Ideologisches Fundament der DDR-Staatsideologie.","cat":"person"},{"date":"09-07","title":"Todestag Wilhelm Pieck (1960) 🕯️","desc":"Wilhelm Pieck, geboren im Jahre 1876, verstarb am 7. September 1960 in Moskau. Er wurde 84 Jahre alt. Erster und einziger Staatspräsident der DDR (1949–1960), Mitgründer der KPD und der SED. Nach seinem Tod wurde das Amt des Staatspräsidenten abgeschafft und durch den Staatsrat ersetzt.","cat":"person"},{"date":"09-21","title":"Todestag Otto Grotewohl (1964) 🕯️","desc":"Otto Grotewohl, geboren im Jahre 1894, verstarb am 21. September 1964 in Ost-Berlin. Er wurde 70 Jahre alt. Erster Ministerpräsident der DDR (1949–1964), führte die SPD in der Sowjetischen Besatzungszone in die Zwangsvereinigung mit der KPD zur SED (1946).","cat":"person"},{"date":"08-01","title":"Todestag Walter Ulbricht (1973) 🕯️","desc":"Walter Ulbricht, geboren im Jahre 1893, verstarb am 1. August 1973 am Döllnsee in Brandenburg. Er wurde 80 Jahre alt. Erster Sekretär der SED (1950–1971) und Vorsitzender des Staatsrats (1960–1973). Maßgeblich für den Aufbau der DDR verantwortlich, ordnete den Mauerbau 1961 an.","cat":"person"},{"date":"08-25","title":"Geburtstag Erich Honecker (1912) 🕯️","desc":"Erich Honecker wurde am 25. August 1912 in Neunkirchen (Saar) geboren und starb 1994 mit 81 Jahren. Er wäre heute 122 Jahre alt. Generalsekretär der SED und Vorsitzender des Staatsrats (1971–1989), prägte die DDR in ihrer Spätphase. Verantwortlich für den Schießbefehl an der Grenze. Floh 1991 nach Chile, wo er 1994 verstarb.","cat":"person"},{"date":"05-29","title":"Todestag Erich Honecker (1994) 🕯️","desc":"Erich Honecker, geboren im Jahre 1912, verstarb am 29. Mai 1994 in Santiago de Chile. Er wurde 81 Jahre alt. Generalsekretär der SED und Vorsitzender des Staatsrats der DDR (1971–1989). Nach dem Mauerfall angeklagt, floh er 1991 in die chilenische Botschaft in Moskau und später nach Chile, wo er an Leberkrebs starb.","cat":"person"},{"date":"04-17","title":"Geburtstag Margot Honecker (1927) 🕯️","desc":"Margot Honecker wurde am 17. April 1927 in Halle (Saale) geboren und starb 2016 mit 89 Jahren. Sie wäre heute 107 Jahre alt. Ministerin für Volksbildung der DDR (1963–1989), eine der mächtigsten Frauen des Staates. Ehefrau von Erich Honecker. Verantwortlich für das sozialistische Bildungssystem der DDR. Floh nach dem Mauerfall nach Chile, wo sie 2016 verstarb.","cat":"person"},{"date":"05-06","title":"Todestag Margot Honecker (2016) 🕯️","desc":"Margot Honecker, geboren im Jahre 1927, verstarb am 6. Mai 2016 in Santiago de Chile. Sie wurde 89 Jahre alt. Ministerin für Volksbildung der DDR (1963–1989), prägte das sozialistische Schul- und Erziehungswesen. Nach dem Mauerfall floh sie gemeinsam mit Erich Honecker nach Chile, wo sie bis zu ihrem Tod lebte.","cat":"person"},{"date":"03-19","title":"Geburtstag Egon Krenz (1937) 🕯️","desc":"Egon Krenz wurde am 19. März 1937 in Kołobrzeg (damals Kolberg, heute Polen) geboren. Er ist heute 97 Jahre alt. Letzter Generalsekretär der SED und Vorsitzender des Staatsrats der DDR (Oktober–Dezember 1989). Langjähriger FDJ-Vorsitzender (1974–1983), galt als designierter Nachfolger Honeckers. Öffnete am 9. November 1989 die Berliner Mauer. 1997 wegen Totschlags an Mauerflüchtlingen verurteilt.","cat":"person"},{"date":"12-28","title":"Geburtstag Erich Mielke (1907) 🕯️","desc":"Erich Mielke wurde am 28. Dezember 1907 in Berlin geboren und starb 2000 mit 92 Jahren. Er wäre heute 127 Jahre alt. Minister für Staatssicherheit der DDR (1957–1989), Chef der Stasi. Baute den DDR-Geheimdienst zu einem der effektivsten Überwachungsapparate der Welt aus. 1993 wegen Mordes an zwei Polizisten im Jahr 1931 verurteilt.","cat":"person"},{"date":"05-21","title":"Todestag Erich Mielke (2000) 🕯️","desc":"Erich Mielke, geboren im Jahre 1907, verstarb am 21. Mai 2000 in Berlin. Er wurde 92 Jahre alt. Minister für Staatssicherheit der DDR (1957–1989). Unter seiner Führung beschäftigte die Stasi über 90.000 hauptamtliche Mitarbeiter und rund 170.000 inoffizielle Informanten. Nach der Wende wegen Mordes verurteilt, wegen Verhandlungsunfähigkeit jedoch vorzeitig entlassen.","cat":"person"},{"date":"01-15","title":"Ermordung Rosa Luxemburg (1919) 🌹","desc":"Rosa Luxemburg, geboren im Jahre 1871, wurde am 15. Januar 1919 in Berlin ermordet. Sie wurde 47 Jahre alt. Mitbegründerin der KPD, revolutionäre Sozialistin und Theoretikerin. Nach dem Spartakusaufstand von Freikorpssoldaten verhaftet, misshandelt und erschossen. Ihre Leiche wurde in den Landwehrkanal geworfen. In der DDR als Märtyrerin der Arbeiterbewegung verehrt.","cat":"person"},{"date":"01-15","title":"Ermordung Karl Liebknecht (1919) 🕯️","desc":"Karl Liebknecht, geboren im Jahre 1871, wurde am 15. Januar 1919 in Berlin ermordet. Er wurde 47 Jahre alt. Mitbegründer der KPD, erklärte am 9. November 1918 die Freie Sozialistische Republik Deutschland. Nach dem Spartakusaufstand von Freikorpssoldaten verhaftet, misshandelt und erschossen. In der DDR als Märtyrer der Arbeiterbewegung verehrt.","cat":"person"},{"date":"03-17","title":"Weltschifffahrtstag 🚢","desc":"Weltschifffahrtstag – 17. März. Internationaler Gedenktag der Schifffahrt, ausgerufen von der Internationalen Seeschifffahrts-Organisation (IMO). In der DDR im Kontext der Seeverkehrswirtschaft und des Rostocker Hafens begangen.","cat":"international"},{"date":"04-12","title":"Tag der Luft- und Raumfahrt 🚀","desc":"Tag der Luft- und Raumfahrt – 12. April. Jahrestag des ersten bemannten Weltraumflugs durch Juri Gagarin am 12. April 1961. In der DDR mit Veranstaltungen in Schulen, Betrieben und Planetarien begangen. Besonders bedeutsam nach dem gemeinsamen Weltraumflug von Sigmund Jähn am 26. August 1978, dem ersten Deutschen im Weltall.","cat":"beruf"},{"date":"04-12","title":"Tag der Jungen Techniker und Naturforscher 🔬","desc":"Tag der Jungen Techniker und Naturforscher – 12. April. Ehrentag der Kinder und Jugendlichen, die sich in den Arbeitsgemeinschaften für Technik, Naturwissenschaft und Astronomie engagierten. Organisiert durch die Pionierorganisation Ernst Thälmann und die Gesellschaft für Sport und Technik (GST). Begleitet von Ausstellungen, Wettbewerben und Vorführungen.","cat":"beruf"},{"date":"04-23","title":"Welttag des Buches 📖","desc":"Welttag des Buches – 23. April. Internationaler Gedenktag für Literatur und das Lesen. In der DDR im Kontext der sozialistischen Bildungspolitik und des staatlichen Verlagswesens begangen. Die DDR hatte eine der höchsten Lesequoten der Welt.","cat":"international"},{"date":"04-30","title":"Welttag der Partnerstädte 🤝","desc":"Welttag der Partnerstädte – letzter Sonntag im April. Internationaler Gedenktag der Städtepartnerschaften, ausgerufen vom Weltverband der Partnerstädte (WFUCA). In der DDR wurden Partnerschaften vor allem mit sozialistischen Städten in der UdSSR, Polen, der Tschechoslowakei und anderen Bruderstaaten gepflegt.","cat":"international"},{"date":"06-16","title":"Tag der Solidarität mit Südafrika ✊","desc":"Tag der Solidarität mit dem Kampf des Volkes von Südafrika – 16. Juni. Gedenktag im Andenken an den Soweto-Aufstand vom 16. Juni 1976, bei dem südafrikanische Schüler gegen die Apartheidpolitik protestierten und von der Polizei erschossen wurden. In der DDR als antiimperialistischer Solidaritätstag begangen.","cat":"international"}],"2035":[{"date":"01-15","title":"Liebknecht & Luxemburg Gedenktag 🌹","desc":"Gedenktag für Karl Liebknecht und Rosa Luxemburg – am Sonntag, der dem 15. Januar am nächsten liegt. Beide wurden am 15. Januar 1919 ermordet. Jährliche Gedenkdemonstration in Berlin.","cat":"staat"},{"date":"02-11","title":"Tag der Werktätigen des Post- und Fernmeldewesens 📮","desc":"Ehrentag der Beschäftigten im Post- und Fernmeldewesen der DDR – zweiter Sonntag im Februar.","cat":"beruf"},{"date":"02-08","title":"Tag des MfS 🔍","desc":"Tag des Ministeriums für Staatssicherheit (MfS/Stasi) – gegründet am 8. Februar 1950. Inoffizieller Gedenktag innerhalb des Apparats.","cat":"staat"},{"date":"02-18","title":"Tag der Mitarbeiter des Handels 🛒","desc":"Ehrentag der Beschäftigten im Einzelhandel und Handelswesen der DDR – dritter Sonntag im Februar.","cat":"beruf"},{"date":"03-01","title":"Tag der NVA 🪖","desc":"Tag der Nationalen Volksarmee der DDR – begangen am 1. März. Gegründet am 1. März 1956. Gefeiert mit Paraden und Appellen.","cat":"staat"},{"date":"03-07","title":"Tag der FDJ 🔵","desc":"Jahrestag der Gründung der Freien Deutschen Jugend am 7. März 1946. Massenorganisation der DDR-Jugend. Gefeiert mit Appellen, Fackelzügen und kulturellen Veranstaltungen.","cat":"staat"},{"date":"03-08","title":"Internationaler Frauentag 👩","desc":"Internationaler Frauentag – offizieller Gedenk- und Feiertag der DDR. Beschäftigte Frauen erhielten häufig einen bezahlten arbeitsfreien Tag. Mit Blumen, Veranstaltungen und Auszeichnungen begangen.","cat":"international"},{"date":"03-19","title":"Jahrestag der Pariser Kommune 🏴","desc":"Jahrestag der Pariser Kommune vom 18. März 1871 – erstes Experiment einer Arbeiterregierung in der Geschichte. In der DDR als revolutionäres Vorbild gewürdigt.","cat":"staat"},{"date":"04-11","title":"Befreiung KZ Buchenwald 🕯️","desc":"Gedenktag zur Befreiung des Konzentrationslagers Buchenwald am 11. April 1945 durch US-amerikanische Truppen. Einer der zentralen Gedenkfeiern in der DDR – Buchenwald als nationales Mahnmal gepflegt.","cat":"staat"},{"date":"04-08","title":"Tag des Metallarbeiters ⚙️","desc":"Ehrentag der Metallarbeiterinnen und Metallarbeiter der DDR – zweiter Sonntag im April. Gefeiert in Betrieben der metallerzeugenden und metallverarbeitenden Industrie.","cat":"beruf"},{"date":"04-21","title":"Gründungstag der SED 🔴","desc":"Jahrestag der Gründung der Sozialistischen Einheitspartei Deutschlands (SED) am 21./22. April 1946 durch Zwangsvereinigung von SPD und KPD in der Sowjetischen Besatzungszone.","cat":"staat"},{"date":"04-22","title":"Geburtstag Lenin ☭","desc":"Wladimir Iljitsch Lenin wurde am 22. April 1870 in Simbirsk (heute Uljanowsk) geboren und starb 1924 mit 53 Jahren. Er wäre heute 165 Jahre alt. Begründer der Sowjetunion und theoretischer Vordenker des Marxismus-Leninismus. Gedenktag in Betrieben, Schulen und Parteiorganisationen.","cat":"person"},{"date":"05-01","title":"Tag der Arbeit ✊","desc":"Internationaler Kampf- und Feiertag der Werktätigen – 1. Mai. Größter politischer Feiertag im Frühling. Massenaufmärsche, Kundgebungen und Militärparaden in allen Städten der DDR.","cat":"staat"},{"date":"05-08","title":"Jahrestag der Befreiung 🕊️","desc":"Jahrestag der Befreiung vom Hitlerfaschismus am 8. Mai 1945 – Tag der bedingungslosen Kapitulation der Wehrmacht. In der DDR als 'Tag der Befreiung' begangen, nicht als Niederlage, sondern als Befreiung durch die Sowjetunion.","cat":"staat"},{"date":"05-09","title":"Tag des Sieges 🎖️","desc":"Tag des Sieges der Völker der UdSSR über den Hitlerfaschismus – 9. Mai 1945 (sowjetischer Kalender). In der DDR parallel zum 8. Mai als Ausdruck der engen Verbundenheit mit der Sowjetunion begangen.","cat":"staat"},{"date":"06-01","title":"Internationaler Kindertag 🎈","desc":"Internationaler Kindertag – 1. Juni. Einer der beliebtesten Feiertage in der DDR. Kinder erhielten Geschenke, Schulen und Betriebe organisierten Feste und Ausflüge.","cat":"international"},{"date":"06-12","title":"Tag des Lehrers 📚","desc":"Tag des Lehrers – 12. Juni. Ehrentag für Lehrerinnen und Lehrer in der DDR. Schülerinnen und Schüler überreichten Blumen und Geschenke, Schulen veranstalteten Feierstunden.","cat":"beruf"},{"date":"06-10","title":"Tag des Eisenbahners 🚂","desc":"Tag des Eisenbahners und der Werktätigen des Verkehrswesens – zweiter Sonntag im Juni. Ehrentag der Beschäftigten der Deutschen Reichsbahn und des gesamten Verkehrswesens.","cat":"beruf"},{"date":"05-12","title":"Tag der Jugendbrigaden 👷","desc":"Tag der Jugendbrigaden – Freitag vor Pfingsten (ab 1978). Ehrentag der sozialistischen Jugendbrigaden in Betrieben und Kombinaten der DDR. Auszeichnungen für herausragende Arbeitsleistungen junger Werktätiger.","cat":"staat"},{"date":"06-16","title":"Tag der Werktätigen der Wasserwirtschaft 💧","desc":"Tag der Werktätigen der Wasserwirtschaft – dritter Sonnabend im Juni. Ehrentag der Beschäftigten in Wasserversorgung, Abwasserwirtschaft und Gewässerschutz der DDR.","cat":"beruf"},{"date":"06-22","title":"Gedenktag: Überfall auf die Sowjetunion 🕯️","desc":"Jahrestag des deutschen Überfalls auf die Sowjetunion am 22. Juni 1941 – Beginn des 'Großen Vaterländischen Krieges'. In der DDR als Mahntag gegen Krieg und Faschismus begangen.","cat":"international"},{"date":"06-17","title":"Tag der Genossenschaftsbauern 🌾","desc":"Tag der Genossenschaftsbauern und Arbeiter der sozialistischen Land- und Forstwirtschaft – dritter Sonntag im Juni. Ehrentag der Beschäftigten in den Landwirtschaftlichen Produktionsgenossenschaften (LPG).","cat":"beruf"},{"date":"06-24","title":"Tag des Bauarbeiters 🏗️","desc":"Tag des Bauarbeiters – vierter Sonntag im Juni. Ehrentag der Beschäftigten im Bauwesen der DDR. Mit Betriebsfeiern und Auszeichnungen begangen.","cat":"beruf"},{"date":"07-01","title":"Tag der Deutschen Volkspolizei 🚔","desc":"Tag der Deutschen Volkspolizei – 1. Juli. Ehrentag der Volkspolizei der DDR. Begangen mit Appellen, Auszeichnungen und öffentlichen Veranstaltungen.","cat":"international"},{"date":"07-01","title":"Tag des Bergmanns und Energiearbeiters ⛏️","desc":"Tag des Bergmanns und des Energiearbeiters – erster Sonntag im Juli. Ehrentag der Beschäftigten im Bergbau und in der Energiewirtschaft. Besonders bedeutsam in den Braunkohlerevieren der DDR.","cat":"beruf"},{"date":"07-18","title":"Tag der Internationalen Brigaden 🌍","desc":"Tag der Internationalen Brigaden – 18. Juli. Gedenktag für die internationalen Freiwilligen, die im Spanischen Bürgerkrieg (1936–1939) gegen den Faschismus kämpften. In der DDR als antifaschistisches Symbol gewürdigt.","cat":"international"},{"date":"08-02","title":"Potsdamer Abkommen (1945) 📜","desc":"Jahrestag der Unterzeichnung des Potsdamer Abkommens am 2. August 1945 durch UdSSR, USA und Großbritannien. Regelte die Nachkriegsordnung Deutschlands. In der DDR als Grundlage der Nachkriegspolitik gewürdigt.","cat":"staat"},{"date":"08-07","title":"Gründung der GST (1952) 🚀","desc":"Jahrestag der Gründung der Gesellschaft für Sport und Technik (GST) am 7. August 1952. Paramilitärische Massenorganisation der DDR zur vormilitärischen Ausbildung von Jugendlichen.","cat":"staat"},{"date":"09-01","title":"Weltfriedenstag ☮️","desc":"Weltfriedenstag – 1. September. Jahrestag des Beginns des Zweiten Weltkriegs (1939). In der DDR als internationaler Antikriegstag und Friedensappell begangen.","cat":"international"},{"date":"09-08","title":"Weltalphabetisierungstag 📖","desc":"Weltalphabetisierungstag – 8. September. Internationaler Gedenktag für Bildung und Bekämpfung des Analphabetismus. In der DDR im Kontext der sozialistischen Bildungspolitik begangen.","cat":"staat"},{"date":"09-15","title":"Tag der haus- und kommunalwirtschaftlichen Dienstleistungen 🏘️","desc":"Tag der Werktätigen des Bereiches der haus- und kommunalwirtschaftlichen Dienstleistungen – dritter Sonnabend im September. Ehrentag der Beschäftigten in Hauswirtschaft, Wohnungswirtschaft und kommunalen Diensten.","cat":"beruf"},{"date":"09-09","title":"OdF-Tag – Gedenktag Opfer des Faschismus 🕯️","desc":"Internationaler Gedenktag für die Opfer des faschistischen Terrors und Kampftag gegen Faschismus und imperialistischen Krieg – zweiter Sonntag im September. Einer der bedeutendsten Gedenktage der DDR. Kranzniederlegungen, Gedenkfeiern an Mahnmalen.","cat":"international"},{"date":"10-09","title":"Weltposttag 📬","desc":"Weltposttag – 9. Oktober. Internationaler Gedenktag des Weltpostvereins. In der DDR im Zusammenhang mit dem Ehrentag der Post- und Fernmeldewerktätigen begangen.","cat":"international"},{"date":"10-13","title":"Tag der Seeverkehrswirtschaft ⚓","desc":"Tag der Seeverkehrswirtschaft – 13. Oktober. Ehrentag der Beschäftigten in der Seefahrt und Binnenschifffahrt der DDR. Bedeutsam für Rostock und die Ostseehäfen.","cat":"beruf"},{"date":"10-16","title":"Welternährungstag 🌽","desc":"Welternährungstag – 16. Oktober. Internationaler Gedenktag der FAO. In der DDR im Kontext sozialistischer Landwirtschaftspolitik und internationaler Solidarität begangen.","cat":"staat"},{"date":"10-20","title":"Tag der Leicht- und Lebensmittelindustrie 🏭","desc":"Tag der Werktätigen der Leicht-, Lebensmittel- und Nahrungsgüterindustrie – dritter Sonnabend im Oktober. Ehrentag der Beschäftigten in der Konsumgüter- und Nahrungsmittelproduktion der DDR.","cat":"beruf"},{"date":"10-24","title":"Tag der Vereinten Nationen 🌐","desc":"Tag der Vereinten Nationen – 24. Oktober. Jahrestag des Inkrafttretens der UN-Charta (1945). Die DDR trat den Vereinten Nationen 1973 bei und nutzte den Tag für Bekenntnisse zu Frieden und internationaler Zusammenarbeit.","cat":"international"},{"date":"10-07","title":"Tag der Republik 🇩🇪","desc":"Am 21. April 1950 wurde der Nationalfeiertag der Deutschen Demokratischen Republik am 7. Oktober zum bedeutendsten Staatsfeiertag der DDR erklärt. Seitdem wurde er jährlich in Berlin festlich mit einem Staatsakt und einer Militärparade begangen. In der ganzen Republik feierte das Volk mit staatlich organisierten Demonstrationen, Festveranstaltungen und Fackelzügen der FDJ den Tag der Republik. An diesem Tag wurden auch die Nationalpreise der DDR an verdiente Künstler, Wissenschaftler, Techniker und Aktivisten verliehen. Zu runden Jahrestagen gab besonders große Feierlichkeiten. Außerdem wurden alle fünf Jahre Sonderbriefmarken zum Staatsgeburtstag der DDR herausgegeben.","cat":"staat"},{"date":"11-07","title":"Jahrestag der Oktoberrevolution ☭","desc":"Jahrestag der Großen Sozialistischen Oktoberrevolution vom 7. November 1917. Wichtigster ideologischer Feiertag der DDR nach dem Tag der Republik. Kundgebungen, Feierstunden in Betrieben, Schulen und Parteiorganisationen.","cat":"staat"},{"date":"11-10","title":"Gründung des WBDJ / Weltjugendtag 🌍","desc":"Jahrestag der Gründung des Weltbundes der Demokratischen Jugend (WBDJ) am 10. November 1945 in London. Weltjugendtag – in der DDR als Zeichen internationaler Jugendbewegung und sozialistischer Solidarität begangen.","cat":"international"},{"date":"11-17","title":"Internationaler Studententag 🎓","desc":"Internationaler Studententag – 17. November. Gedenktag für die Opfer der nationalsozialistischen Repression gegen tschechische Studenten 1939. In der DDR als antifaschistischer Kampftag der Studentenbewegung begangen.","cat":"international"},{"date":"11-17","title":"Tag der Militärjustizorgane ⚖️","desc":"Tag der Militärjustizorgane der DDR – 17. November. Ehrentag der Beschäftigten in der Militärjustiz der Nationalen Volksarmee.","cat":"international"},{"date":"11-29","title":"Solidaritätstag mit dem palästinensischen Volk 🫱","desc":"Internationaler Tag der Solidarität mit dem palästinensischen Volk – 29. November. Von der UN-Generalversammlung 1977 ausgerufen. Die DDR unterhielt enge Beziehungen zur PLO und beging diesen Tag offiziell.","cat":"international"},{"date":"11-11","title":"Tag des Chemiearbeiters 🧪","desc":"Tag des Chemiearbeiters – zweiter Sonntag im November. Ehrentag der Beschäftigten in der chemischen Industrie der DDR, einem der wichtigsten Wirtschaftszweige.","cat":"beruf"},{"date":"11-18","title":"Tag des Metallurgen 🔩","desc":"Tag des Metallurgen – dritter Sonntag im November. Ehrentag der Beschäftigten in der Hüttenindustrie und Metallurgie der DDR.","cat":"beruf"},{"date":"12-01","title":"Tag der Grenztruppen der DDR 🛡️","desc":"Tag der Grenztruppen der DDR – 1. Dezember. Ehrentag der Grenzsoldaten, die die Staatsgrenze der DDR sicherten. Begangen mit Appellen und Auszeichnungen.","cat":"staat"},{"date":"12-11","title":"Tag des Gesundheitswesens 🏥","desc":"Tag des Gesundheitswesens – 11. Dezember. Ehrentag der Beschäftigten im Gesundheits- und Sozialwesen der DDR. Auszeichnungen für herausragende Leistungen in der medizinischen Versorgung.","cat":"beruf"},{"date":"12-13","title":"Pioniergeburtstag 🔴","desc":"Jahrestag der Gründung der Pionierorganisation Ernst Thälmann am 13. Dezember 1948. Massenorganisation für Kinder und Jugendliche der DDR (6–14 Jahre). Gefeiert mit Appellen, kulturellen Veranstaltungen und Aufnahmezeremonien.","cat":"person"},{"date":"12-30","title":"KPD-Gründung (1918) ✊","desc":"Jahrestag der Gründung der Kommunistischen Partei Deutschlands (KPD) am 30. Dezember 1918 in Berlin. Mitgegründet von Rosa Luxemburg und Karl Liebknecht. Ideologischer Ursprungsfeiertag der SED.","cat":"international"},{"date":"12-30","title":"Gründung der UdSSR (1922) ☭","desc":"Jahrestag der Gründung der Union der Sozialistischen Sowjetrepubliken (UdSSR) am 30. Dezember 1922. In der DDR als Jubiläum des ersten sozialistischen Staates gewürdigt. Die Sowjetunion war ein von der KPdSU zentralistisch regierter, föderativer Vielvölkerstaat, dessen Territorium sich über Osteuropa, den Kaukasus, Zentral- und über das gesamte Nordasien erstreckte. Zu den 15 Unionsrepubliken der UdSSR gehörten die Russische SFSR, die Ukrainische SSR, die Weißrussische SSR, die Usbekische SSR, die Kasachische SSR, die Georgische SSR, die Aserbaidschanische SSR, die Litauische SSR, die Moldauische SSR, die Lettische SSR, die Kirgisische SSR, die Tadschikische SSR, die Armenische SSR, die Turkmenische SSR und die Estnische SSR.","cat":"staat"},{"date":"02-11","title":"Tag der Zivilverteidigung 🪖","desc":"Tag der Zivilverteidigung der DDR – 11. Februar. Ehrentag der Zivilschutzorgane und Bevölkerungsschutzeinrichtungen. Begangen mit Übungen und Auszeichnungen.","cat":"staat"},{"date":"03-21","title":"Internationaler Tag gegen Rassendiskriminierung ✊","desc":"Internationaler Tag für die Beseitigung der Rassendiskriminierung – 21. März. Gedenkt dem Massaker von Sharpeville (1960). In der DDR als antiimperialistischer Kampftag und Zeichen der Solidarität mit den unterdrückten Völkern begangen.","cat":"international"},{"date":"03-23","title":"Welttag der Meteorologie 🌤️","desc":"Welttag der Meteorologie – 23. März. Internationaler Gedenktag der Weltorganisation für Meteorologie (WMO). In der DDR im Kontext des wissenschaftlich-technischen Fortschritts begangen.","cat":"international"},{"date":"03-27","title":"Welttheatertag 🎭","desc":"Welttheatertag – 27. März. Internationaler Gedenktag des Theaterlebens, ausgerufen vom Internationalen Theaterinstitut (ITI). In der DDR mit Aufführungen und Festveranstaltungen an Theatern begangen.","cat":"international"},{"date":"04-07","title":"Weltgesundheitstag 🏥","desc":"Weltgesundheitstag – 7. April. Jahrestag der Gründung der Weltgesundheitsorganisation (WHO, 1948). In der DDR mit Veranstaltungen zur sozialistischen Gesundheitspolitik und kostenloser Grundversorgung begangen.","cat":"international"},{"date":"04-18","title":"Internationaler Denkmaltag 🏛️","desc":"Internationaler Denkmaltag – 18. April. Tag des kulturellen Erbes, ausgerufen vom Internationalen Rat für Denkmalpflege (ICOMOS). In der DDR im Kontext der Denkmalpflege und des sozialistischen Kulturerbes begangen.","cat":"international"},{"date":"04-24","title":"Internationaler Tag der Jugend gegen Kolonialismus 🌍","desc":"Internationaler Tag der Jugend und Studenten gegen Kolonialismus und für friedliche Koexistenz – 24. April. In der DDR als antikolonialer Solidaritätstag begangen.","cat":"international"},{"date":"05-08","title":"Weltrotkreuztag 🏥 🔴","desc":"Weltrotkreuztag – 8. Mai. Geburtstag von Henri Dunant, dem Gründer des Roten Kreuzes (1828). In der DDR durch das Deutsche Rote Kreuz (DRK) mit Veranstaltungen und Spendenaktionen begangen.","cat":"international"},{"date":"05-10","title":"Tag des freien Buches 📚","desc":"Tag des freien Buches – 10. Mai. Gedenktag im Andenken an die Bücherverbrennung durch die Nationalsozialisten am 10. Mai 1933 in Deutschland. In der DDR als antifaschistischer Kulturtag begangen.","cat":"international"},{"date":"05-17","title":"Weltfernmeldetag 📡","desc":"Weltfernmeldetag – 17. Mai. Jahrestag der Gründung der Internationalen Fernmeldeunion (ITU, 1865). In der DDR im Zusammenhang mit dem Ehrentag der Post- und Fernmeldewerktätigen begangen.","cat":"international"},{"date":"05-18","title":"Internationaler Museumstag 🏛️","desc":"Internationaler Museumstag – 18. Mai. Ausgerufen vom Internationalen Museumsrat (ICOM). In der DDR mit kostenlosen Museumseintritten, Sonderführungen und kulturellen Veranstaltungen begangen.","cat":"international"},{"date":"06-05","title":"Weltumwelttag 🌿","desc":"Weltumwelttag – 5. Juni. Ausgerufen von den Vereinten Nationen seit 1972. In der DDR im Kontext des sozialistischen Umweltschutzes und der Naturpflege begangen.","cat":"international"},{"date":"10-01","title":"Weltmusiktag 🎵","desc":"Weltmusiktag – 1. Oktober. Internationaler Gedenktag der Musik, begangen in vielen sozialistischen Ländern. In der DDR mit Konzerten, Musikfestivals und kulturellen Veranstaltungen begangen.","cat":"international"},{"date":"01-03","title":"Geburtstag Wilhelm Pieck (1876) 🕯️","desc":"Wilhelm Pieck wurde am 3. Januar 1876 in Guben geboren und starb 1960 mit 84 Jahren. Er wäre heute 159 Jahre alt. Erster und einziger Staatspräsident der DDR (1949–1960), Mitgründer der KPD und der SED. Nach ihm wurden viele Straßen, Betriebe und Einrichtungen in der DDR benannt.","cat":"person"},{"date":"01-21","title":"Todestag Lenin (1924) 🕯️","desc":"Wladimir Iljitsch Lenin, geboren im Jahre 1870, verstarb am 21. Januar 1924 in Gorki Leninskie. Er wurde 53 Jahre alt. Begründer der Sowjetunion und des Marxismus-Leninismus. In der DDR mit Gedenkfeiern in Betrieben, Schulen und Parteiorganisationen begangen.","cat":"person"},{"date":"03-05","title":"Geburtstag Rosa Luxemburg (1871) 🌹","desc":"Rosa Luxemburg wurde am 5. März 1871 in Zamość (Russisches Kaiserreich, heute Polen) geboren und wurde 1919 mit 47 Jahren ermordet. Sie wäre heute 164 Jahre alt. Mitbegründerin der KPD, revolutionäre Sozialistin und Theoretikerin. Am 15. Januar 1919 ermordet. In der DDR als Märtyrerin der Arbeiterbewegung verehrt.","cat":"person"},{"date":"03-11","title":"Geburtstag Otto Grotewohl (1894) 🕯️","desc":"Otto Grotewohl wurde am 11. März 1894 in Braunschweig geboren und starb 1964 mit 70 Jahren. Er wäre heute 141 Jahre alt. Erster Ministerpräsident der DDR (1949–1964), führte die SPD in der Sowjetischen Besatzungszone in die Zwangsvereinigung mit der KPD zur SED (1946).","cat":"person"},{"date":"03-14","title":"Todestag Karl Marx (1883) 🕯️","desc":"Karl Marx, geboren im Jahre 1818, verstarb am 14. März 1883 in London. Er wurde 64 Jahre alt. Begründer des wissenschaftlichen Sozialismus gemeinsam mit Friedrich Engels. Autor des Kommunistischen Manifests (1848) und des Kapitals. Ideologisches Fundament der DDR.","cat":"person"},{"date":"04-16","title":"Geburtstag Ernst Thälmann (1886) ✊","desc":"Ernst Thälmann wurde am 16. April 1886 in Hamburg geboren und wurde 1944 mit 57 Jahren ermordet. Er wäre heute 149 Jahre alt. Vorsitzender der KPD (1925–1933), inhaftiert von den Nationalsozialisten 1933, am 18. August 1944 im KZ Buchenwald ermordet. Zentrales Heldenbild der DDR – nach ihm wurde die Pionierorganisation benannt.","cat":"person"},{"date":"05-05","title":"Geburtstag Karl Marx (1818) 🕯️","desc":"Karl Marx wurde am 5. Mai 1818 in Trier geboren und starb 1883 mit 64 Jahren. Er wäre heute 217 Jahre alt. Philosoph, Ökonom und revolutionärer Theoretiker. Seine Schriften bildeten die ideologische Grundlage des Marxismus-Leninismus und damit der gesamten DDR-Staatsideologie.","cat":"person"},{"date":"06-30","title":"Geburtstag Walter Ulbricht (1893) 🕯️","desc":"Walter Ulbricht wurde am 30. Juni 1893 in Leipzig geboren und starb 1973 mit 80 Jahren. Er wäre heute 142 Jahre alt. Erster Sekretär der SED (1950–1971) und Vorsitzender des Staatsrats (1960–1973). Maßgeblich für den Aufbau der DDR verantwortlich, ordnete den Mauerbau 1961 an. Gestorben am 1. August 1973.","cat":"person"},{"date":"08-05","title":"Todestag Friedrich Engels (1895) 🕯️","desc":"Friedrich Engels, geboren im Jahre 1820, verstarb am 5. August 1895 in London. Er wurde 74 Jahre alt. Mitbegründer des wissenschaftlichen Sozialismus gemeinsam mit Karl Marx. Finanzierte Marx' Arbeit und vollendete das Kapital nach dessen Tod. Ideologisches Fundament der DDR.","cat":"person"},{"date":"08-13","title":"Geburtstag Karl Liebknecht (1871) 🕯️","desc":"Karl Liebknecht wurde am 13. August 1871 in Leipzig geboren und wurde 1919 mit 47 Jahren ermordet. Er wäre heute 164 Jahre alt. Mitbegründer der KPD, erklärte am 9. November 1918 die Freie Sozialistische Republik Deutschland. Am 15. Januar 1919 gemeinsam mit Rosa Luxemburg ermordet.","cat":"person"},{"date":"08-13","title":"Jahrestag des Mauerbaus (1961) 🧱","desc":"Jahrestag der Sicherung der Staatsgrenze der DDR am 13. August 1961 – in der DDR offiziell als notwendige Schutzmaßnahme gegen den 'Imperialismus' bezeichnet. Beginn des Baus der Berliner Mauer. In der DDR als Stabilisierung des sozialistischen Staates propagiert.","cat":"staat"},{"date":"08-18","title":"Ermordung Ernst Thälmanns (1944) 🕯️","desc":"Ernst Thälmann, geboren im Jahre 1886, wurde am 18. August 1944 im KZ Buchenwald ermordet. Er wurde 57 Jahre alt. Auf Befehl Hitlers erschossen. Zentrales Märtyrerdatum der DDR-Gedenkkultur. Mit Gedenkfeiern, Kranzniederlegungen und Appellen der Pionierorganisation begangen.","cat":"person"},{"date":"11-28","title":"Geburtstag Friedrich Engels (1820) 🕯️","desc":"Friedrich Engels wurde am 28. November 1820 in Barmen (heute Wuppertal) geboren und starb 1895 mit 74 Jahren. Er wäre heute 215 Jahre alt. Mitbegründer des Marxismus, enger Weggefährte von Karl Marx. Ideologisches Fundament der DDR-Staatsideologie.","cat":"person"},{"date":"09-07","title":"Todestag Wilhelm Pieck (1960) 🕯️","desc":"Wilhelm Pieck, geboren im Jahre 1876, verstarb am 7. September 1960 in Moskau. Er wurde 84 Jahre alt. Erster und einziger Staatspräsident der DDR (1949–1960), Mitgründer der KPD und der SED. Nach seinem Tod wurde das Amt des Staatspräsidenten abgeschafft und durch den Staatsrat ersetzt.","cat":"person"},{"date":"09-21","title":"Todestag Otto Grotewohl (1964) 🕯️","desc":"Otto Grotewohl, geboren im Jahre 1894, verstarb am 21. September 1964 in Ost-Berlin. Er wurde 70 Jahre alt. Erster Ministerpräsident der DDR (1949–1964), führte die SPD in der Sowjetischen Besatzungszone in die Zwangsvereinigung mit der KPD zur SED (1946).","cat":"person"},{"date":"08-01","title":"Todestag Walter Ulbricht (1973) 🕯️","desc":"Walter Ulbricht, geboren im Jahre 1893, verstarb am 1. August 1973 am Döllnsee in Brandenburg. Er wurde 80 Jahre alt. Erster Sekretär der SED (1950–1971) und Vorsitzender des Staatsrats (1960–1973). Maßgeblich für den Aufbau der DDR verantwortlich, ordnete den Mauerbau 1961 an.","cat":"person"},{"date":"08-25","title":"Geburtstag Erich Honecker (1912) 🕯️","desc":"Erich Honecker wurde am 25. August 1912 in Neunkirchen (Saar) geboren und starb 1994 mit 81 Jahren. Er wäre heute 123 Jahre alt. Generalsekretär der SED und Vorsitzender des Staatsrats (1971–1989), prägte die DDR in ihrer Spätphase. Verantwortlich für den Schießbefehl an der Grenze. Floh 1991 nach Chile, wo er 1994 verstarb.","cat":"person"},{"date":"05-29","title":"Todestag Erich Honecker (1994) 🕯️","desc":"Erich Honecker, geboren im Jahre 1912, verstarb am 29. Mai 1994 in Santiago de Chile. Er wurde 81 Jahre alt. Generalsekretär der SED und Vorsitzender des Staatsrats der DDR (1971–1989). Nach dem Mauerfall angeklagt, floh er 1991 in die chilenische Botschaft in Moskau und später nach Chile, wo er an Leberkrebs starb.","cat":"person"},{"date":"04-17","title":"Geburtstag Margot Honecker (1927) 🕯️","desc":"Margot Honecker wurde am 17. April 1927 in Halle (Saale) geboren und starb 2016 mit 89 Jahren. Sie wäre heute 108 Jahre alt. Ministerin für Volksbildung der DDR (1963–1989), eine der mächtigsten Frauen des Staates. Ehefrau von Erich Honecker. Verantwortlich für das sozialistische Bildungssystem der DDR. Floh nach dem Mauerfall nach Chile, wo sie 2016 verstarb.","cat":"person"},{"date":"05-06","title":"Todestag Margot Honecker (2016) 🕯️","desc":"Margot Honecker, geboren im Jahre 1927, verstarb am 6. Mai 2016 in Santiago de Chile. Sie wurde 89 Jahre alt. Ministerin für Volksbildung der DDR (1963–1989), prägte das sozialistische Schul- und Erziehungswesen. Nach dem Mauerfall floh sie gemeinsam mit Erich Honecker nach Chile, wo sie bis zu ihrem Tod lebte.","cat":"person"},{"date":"03-19","title":"Geburtstag Egon Krenz (1937) 🕯️","desc":"Egon Krenz wurde am 19. März 1937 in Kołobrzeg (damals Kolberg, heute Polen) geboren. Er ist heute 98 Jahre alt. Letzter Generalsekretär der SED und Vorsitzender des Staatsrats der DDR (Oktober–Dezember 1989). Langjähriger FDJ-Vorsitzender (1974–1983), galt als designierter Nachfolger Honeckers. Öffnete am 9. November 1989 die Berliner Mauer. 1997 wegen Totschlags an Mauerflüchtlingen verurteilt.","cat":"person"},{"date":"12-28","title":"Geburtstag Erich Mielke (1907) 🕯️","desc":"Erich Mielke wurde am 28. Dezember 1907 in Berlin geboren und starb 2000 mit 92 Jahren. Er wäre heute 128 Jahre alt. Minister für Staatssicherheit der DDR (1957–1989), Chef der Stasi. Baute den DDR-Geheimdienst zu einem der effektivsten Überwachungsapparate der Welt aus. 1993 wegen Mordes an zwei Polizisten im Jahr 1931 verurteilt.","cat":"person"},{"date":"05-21","title":"Todestag Erich Mielke (2000) 🕯️","desc":"Erich Mielke, geboren im Jahre 1907, verstarb am 21. Mai 2000 in Berlin. Er wurde 92 Jahre alt. Minister für Staatssicherheit der DDR (1957–1989). Unter seiner Führung beschäftigte die Stasi über 90.000 hauptamtliche Mitarbeiter und rund 170.000 inoffizielle Informanten. Nach der Wende wegen Mordes verurteilt, wegen Verhandlungsunfähigkeit jedoch vorzeitig entlassen.","cat":"person"},{"date":"01-15","title":"Ermordung Rosa Luxemburg (1919) 🌹","desc":"Rosa Luxemburg, geboren im Jahre 1871, wurde am 15. Januar 1919 in Berlin ermordet. Sie wurde 47 Jahre alt. Mitbegründerin der KPD, revolutionäre Sozialistin und Theoretikerin. Nach dem Spartakusaufstand von Freikorpssoldaten verhaftet, misshandelt und erschossen. Ihre Leiche wurde in den Landwehrkanal geworfen. In der DDR als Märtyrerin der Arbeiterbewegung verehrt.","cat":"person"},{"date":"01-15","title":"Ermordung Karl Liebknecht (1919) 🕯️","desc":"Karl Liebknecht, geboren im Jahre 1871, wurde am 15. Januar 1919 in Berlin ermordet. Er wurde 47 Jahre alt. Mitbegründer der KPD, erklärte am 9. November 1918 die Freie Sozialistische Republik Deutschland. Nach dem Spartakusaufstand von Freikorpssoldaten verhaftet, misshandelt und erschossen. In der DDR als Märtyrer der Arbeiterbewegung verehrt.","cat":"person"},{"date":"03-17","title":"Weltschifffahrtstag 🚢","desc":"Weltschifffahrtstag – 17. März. Internationaler Gedenktag der Schifffahrt, ausgerufen von der Internationalen Seeschifffahrts-Organisation (IMO). In der DDR im Kontext der Seeverkehrswirtschaft und des Rostocker Hafens begangen.","cat":"international"},{"date":"04-12","title":"Tag der Luft- und Raumfahrt 🚀","desc":"Tag der Luft- und Raumfahrt – 12. April. Jahrestag des ersten bemannten Weltraumflugs durch Juri Gagarin am 12. April 1961. In der DDR mit Veranstaltungen in Schulen, Betrieben und Planetarien begangen. Besonders bedeutsam nach dem gemeinsamen Weltraumflug von Sigmund Jähn am 26. August 1978, dem ersten Deutschen im Weltall.","cat":"beruf"},{"date":"04-12","title":"Tag der Jungen Techniker und Naturforscher 🔬","desc":"Tag der Jungen Techniker und Naturforscher – 12. April. Ehrentag der Kinder und Jugendlichen, die sich in den Arbeitsgemeinschaften für Technik, Naturwissenschaft und Astronomie engagierten. Organisiert durch die Pionierorganisation Ernst Thälmann und die Gesellschaft für Sport und Technik (GST). Begleitet von Ausstellungen, Wettbewerben und Vorführungen.","cat":"beruf"},{"date":"04-23","title":"Welttag des Buches 📖","desc":"Welttag des Buches – 23. April. Internationaler Gedenktag für Literatur und das Lesen. In der DDR im Kontext der sozialistischen Bildungspolitik und des staatlichen Verlagswesens begangen. Die DDR hatte eine der höchsten Lesequoten der Welt.","cat":"international"},{"date":"04-29","title":"Welttag der Partnerstädte 🤝","desc":"Welttag der Partnerstädte – letzter Sonntag im April. Internationaler Gedenktag der Städtepartnerschaften, ausgerufen vom Weltverband der Partnerstädte (WFUCA). In der DDR wurden Partnerschaften vor allem mit sozialistischen Städten in der UdSSR, Polen, der Tschechoslowakei und anderen Bruderstaaten gepflegt.","cat":"international"},{"date":"06-16","title":"Tag der Solidarität mit Südafrika ✊","desc":"Tag der Solidarität mit dem Kampf des Volkes von Südafrika – 16. Juni. Gedenktag im Andenken an den Soweto-Aufstand vom 16. Juni 1976, bei dem südafrikanische Schüler gegen die Apartheidpolitik protestierten und von der Polizei erschossen wurden. In der DDR als antiimperialistischer Solidaritätstag begangen.","cat":"international"}]};

const MONATE = ['Januar','Februar','März','April','Mai','Juni',
                'Juli','August','September','Oktober','November','Dezember'];
const MONATE_SHORT = ['Jan','Feb','Mär','Apr','Mai','Jun',
                      'Jul','Aug','Sep','Okt','Nov','Dez'];
const WOCHENTAGE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WT_SHORT = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const CAT_LABELS = { staat:'Staatsfeiertag', person:'Person', international:'International', beruf:'Berufstag' };

let currentYear = new Date().getFullYear();
const AVAILABLE_YEARS = Object.keys(ALL_EVENTS).map(Number).sort();
if (!AVAILABLE_YEARS.includes(currentYear)) currentYear = AVAILABLE_YEARS[0];
let activeFilter = 'all';
let currentView = 'heute';

const today = new Date();
const todayKey = String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');

// ── UTILS ──────────────────────────────────────────────────────────────────
function getEvents(year, filter) {
  const f = filter || activeFilter;
  return (ALL_EVENTS[String(year)] || []).filter(e => f === 'all' || e.cat === f);
}
function daysBetween(a, b) {
  const ms = new Date(b.y, b.m-1, b.d) - new Date(a.y, a.m-1, a.d);
  return Math.round(ms / 86400000);
}
function parseKey(key, year) {
  const [m, d] = key.split('-').map(Number);
  return { y: year, m, d };
}

// ── HEUTE VIEW ─────────────────────────────────────────────────────────────
function renderHeute() {
  // Big date
  document.getElementById('heuteDatum').textContent =
    today.getDate() + '. ' + MONATE[today.getMonth()] + ' ' + today.getFullYear();
  document.getElementById('heuteWT').textContent =
    WOCHENTAGE[today.getDay()].toUpperCase();

  // Day count in year
  const start = new Date(today.getFullYear(), 0, 1);
  const dayOfYear = Math.ceil((today - start) / 86400000) + 1;
  const daysLeft = (new Date(today.getFullYear(), 11, 31) - today) / 86400000;
  document.getElementById('heuteDayCount').innerHTML =
    'Tag <span>' + dayOfYear + '</span> von <span>' + (today.getFullYear() % 4 === 0 ? 366 : 365) + '</span> — noch <span>' + Math.round(daysLeft) + '</span> Tage bis Jahresende';

  // Events today
  const yearEvents = ALL_EVENTS[String(today.getFullYear())] || [];
  const todayEvents = yearEvents.filter(e => e.date === todayKey);
  const heuteEventsEl = document.getElementById('heuteEvents');
  document.getElementById('heuteSectionLabel').textContent =
    todayEvents.length ? 'Termine heute (' + todayEvents.length + ')' : 'Termine heute';

  if (todayEvents.length === 0) {
    heuteEventsEl.innerHTML = '<div class="heute-leer">Kein Gedenktag heute</div>';
  } else {
    heuteEventsEl.innerHTML = '';
    todayEvents.forEach(e => {
      const card = document.createElement('div');
      card.className = 'h-card ' + e.cat;
      card.innerHTML =
        '<div class="h-card-cat">' + (CAT_LABELS[e.cat] || e.cat) + '</div>' +
        '<div class="h-card-title">' + e.title + '</div>' +
        '<div class="h-card-desc">' + e.desc + '</div>';
      card.addEventListener('click', () => openModal(
        today.getFullYear(), today.getMonth(), today.getDate(), todayEvents
      ));
      heuteEventsEl.appendChild(card);
    });
  }

  // Nächste Termine – collect next 10 days with events
  const naechsteEl = document.getElementById('naechsteList');
  naechsteEl.innerHTML = '';
  const upcoming = [];
  let checkYear = today.getFullYear();
  let checkDate = new Date(today);
  checkDate.setDate(checkDate.getDate() + 1); // start tomorrow

  for (let i = 0; i < 366 && upcoming.length < 8; i++) {
    const cy = checkDate.getFullYear();
    const key = String(checkDate.getMonth()+1).padStart(2,'0') + '-' + String(checkDate.getDate()).padStart(2,'0');
    const yearEvs = ALL_EVENTS[String(cy)] || [];
    const dayEvs = yearEvs.filter(e => e.date === key);
    if (dayEvs.length) {
      upcoming.push({ date: new Date(checkDate), key, events: dayEvs });
    }
    checkDate.setDate(checkDate.getDate() + 1);
  }

  upcoming.forEach(item => {
    const daysUntil = Math.round((item.date - today) / 86400000);
    const row = document.createElement('div');
    row.className = 'naechste-item';
    const cats = [...new Set(item.events.map(e => e.cat))];
    const dotsHtml = cats.map(c => '<div class="naechste-dot ' + c + '"></div>').join('');
    const inLabel = daysUntil === 1 ? 'morgen' : 'in ' + daysUntil + 'd';
    row.innerHTML =
      '<div class="naechste-date-block">' +
        '<div class="naechste-day">' + item.date.getDate() + '</div>' +
        '<div class="naechste-mon">' + MONATE_SHORT[item.date.getMonth()] + '</div>' +
        '<div class="naechste-in">' + inLabel + '</div>' +
      '</div>' +
      '<div class="naechste-info">' +
        '<div class="naechste-title">' +
          (item.events.length === 1 ? item.events[0].title : item.events.length + ' Termine') +
        '</div>' +
        '<div class="naechste-dots">' + dotsHtml + '</div>' +
      '</div>';
    row.addEventListener('click', () => openModal(
      item.date.getFullYear(), item.date.getMonth(), item.date.getDate(), item.events
    ));
    naechsteEl.appendChild(row);
  });
}

// ── KALENDER VIEW ──────────────────────────────────────────────────────────
function renderKalender() {
  const kalender = document.getElementById('kalender');
  kalender.innerHTML = '';

  const dayMap = {};
  (ALL_EVENTS[String(currentYear)] || []).forEach(e => {
    if (!dayMap[e.date]) dayMap[e.date] = [];
    dayMap[e.date].push(e);
  });
  const allEvents = getEvents(currentYear);

  document.getElementById('yearDisplay').textContent = currentYear;
  document.getElementById('prevYear').disabled = currentYear <= AVAILABLE_YEARS[0];
  document.getElementById('nextYear').disabled = currentYear >= AVAILABLE_YEARS[AVAILABLE_YEARS.length-1];

  for (let m = 0; m < 12; m++) {
    const monthEvents = allEvents.filter(e => e.date.startsWith(String(m+1).padStart(2,'0')));
    const monat = document.createElement('div');
    monat.className = 'monat';
    monat.innerHTML =
      '<div class="monat-header">' +
        '<span class="monat-name">' + MONATE[m] + '</span>' +
        '<span class="monat-count' + (monthEvents.length ? ' has-events' : '') + '">' +
          (monthEvents.length || '') + '</span>' +
      '</div>' +
      '<div class="wochen-kopf">' +
        WT_SHORT.map((w,i) => '<div class="wt' + (i>=5?' we':'') + '">' + w + '</div>').join('') +
      '</div>';

    const grid = document.createElement('div');
    grid.className = 'tage-grid';

    const firstDay = new Date(currentYear, m, 1).getDay();
    const startOffset = (firstDay + 6) % 7;
    const daysInMonth = new Date(currentYear, m+1, 0).getDate();

    for (let i = 0; i < startOffset; i++) {
      grid.appendChild(Object.assign(document.createElement('div'), { className: 'tag leer' }));
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const key = String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      const allDay = dayMap[key] || [];
      const visibleDay = activeFilter === 'all' ? allDay : allDay.filter(e => e.cat === activeFilter);
      const dow = new Date(currentYear, m, d).getDay();
      const isToday = today.getFullYear() === currentYear && today.getMonth() === m && today.getDate() === d;
      const cell = document.createElement('div');
      cell.className = 'tag' +
        (dow === 0 || dow === 6 ? ' wochenende' : '') +
        (visibleDay.length ? ' hat-events' : '') +
        (isToday ? ' heute-mark' : '');
      cell.innerHTML = '<div class="tag-num">' + d + '</div>';
      if (visibleDay.length) {
        const dots = document.createElement('div');
        dots.className = 'event-dots';
        visibleDay.slice(0,4).forEach(e => {
          dots.appendChild(Object.assign(document.createElement('div'), { className: 'dot ' + e.cat }));
        });
        cell.appendChild(dots);
        cell.addEventListener('click', () => openModal(currentYear, m, d, allDay));
      }
      grid.appendChild(cell);
    }
    monat.appendChild(grid);
    kalender.appendChild(monat);
  }
}

// ── MODAL ──────────────────────────────────────────────────────────────────
function openModal(year, month, day, events) {
  const visible = activeFilter === 'all' ? events : events.filter(e => e.cat === activeFilter);
  if (!visible.length) return;
  const d = new Date(year, month, day);
  document.getElementById('modalDate').textContent =
    WOCHENTAGE[d.getDay()] + ', ' + d.getDate() + '. ' + MONATE[month] + ' ' + year;
  const body = document.getElementById('modalBody');
  body.innerHTML = '';
  visible.forEach(e => {
    const c = document.createElement('div');
    c.className = 'm-card ' + e.cat;
    c.innerHTML =
      '<div class="m-cat">' + (CAT_LABELS[e.cat] || e.cat) + '</div>' +
      '<div class="m-title">' + e.title + '</div>' +
      '<div class="m-desc">' + e.desc + '</div>';
    body.appendChild(c);
  });
  document.getElementById('overlay').classList.add('open');
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }

// ── VIEW SWITCHING ─────────────────────────────────────────────────────────
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  document.getElementById('view-heute').classList.toggle('active', view === 'heute');
  document.getElementById('view-kalender').classList.toggle('active', view === 'kalender');
  document.getElementById('filterBar').style.display = view === 'kalender' ? 'flex' : 'none';
  document.querySelector('.year-nav').style.visibility = view === 'kalender' ? 'visible' : 'hidden';
}

// ── EVENT LISTENERS ────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    switchView(tab.dataset.view);
    if (tab.dataset.view === 'kalender') renderKalender();
  });
});
document.getElementById('prevYear').addEventListener('click', () => {
  const idx = AVAILABLE_YEARS.indexOf(currentYear);
  if (idx > 0) { currentYear = AVAILABLE_YEARS[idx-1]; renderKalender(); }
});
document.getElementById('nextYear').addEventListener('click', () => {
  const idx = AVAILABLE_YEARS.indexOf(currentYear);
  if (idx < AVAILABLE_YEARS.length-1) { currentYear = AVAILABLE_YEARS[idx+1]; renderKalender(); }
});
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.cat;
    renderKalender();
  });
});
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── PWA: Install Prompt ────────────────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').classList.add('visible');
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') {
    document.getElementById('installBtn').classList.remove('visible');
  }
  deferredPrompt = null;
});
window.addEventListener('appinstalled', () => {
  document.getElementById('installBtn').classList.remove('visible');
});

// ── PWA: Service Worker ────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// ── INIT ───────────────────────────────────────────────────────────────────
renderHeute();
switchView('heute');
</script>
</body>
